<!-- Shared styles: lock screen AND the about:blank site -->
<style id="base">
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap');
:root{--bg:#0a0e1c;--text:#eef1ff;--muted:#9aa3c7;--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.15);--a:#5eead4;--b:#a78bfa;--on:#0a0e1c}
/* ---- THEMES ---- */
[data-theme=ocean]{--bg:#041320;--a:#38bdf8;--b:#3b82f6;--on:#041320}
[data-theme=sunset]{--bg:#180a13;--a:#fb923c;--b:#f43f5e;--on:#180a13}
[data-theme=forest]{--bg:#06130d;--a:#4ade80;--b:#14b8a6;--on:#06130d}
[data-theme=henry]{--bg:#03160b;--a:#C5B358;--b:#1f8a4c;--on:#03160b;--muted:#a9b79a;--glass:rgba(197,179,88,.07);--edge:rgba(197,179,88,.28)}
[data-theme=rose]{--bg:#150a1c;--a:#f472b6;--b:#c084fc;--on:#150a1c}
[data-theme=slate]{--bg:#0d0f12;--a:#e2e8f0;--b:#64748b;--on:#0d0f12}
@property --h{syntax:'<number>';inherits:true;initial-value:0}
@keyframes hue{to{--h:360}}
[data-theme=rainbow]{--bg:#0b0b12;--a:hsl(var(--h) 90% 65%);--b:hsl(calc(var(--h) + 140) 90% 65%);--on:#0b0b12;animation:hue 14s steps(70) infinite}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
[hidden]{display:none!important}
html{scrollbar-gutter:stable;-webkit-text-size-adjust:100%}body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body{font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow-x:clip;transition:background .4s}
body::before,body::after{content:"";position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.4;z-index:-1;animation:drift 22s ease-in-out infinite alternate}
body::before{background:var(--b);top:-18vmax;left:-12vmax}
body::after{background:var(--a);bottom:-22vmax;right:-14vmax;animation-delay:-8s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);border-radius:24px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<!-- Lock screen only -->
<style>
.lock{min-height:100%;display:grid;place-items:center;padding:24px}
.lock .glass{width:min(380px,100%);padding:40px 32px;text-align:center}
.lock h1{font-size:1.5rem;font-weight:600;margin-bottom:8px}
.lock p{color:var(--muted);font-size:.9rem;margin-bottom:26px}
.lock input{width:100%;padding:14px 16px;border-radius:14px;text-align:center;letter-spacing:.05em;font:inherit;background:rgba(255,255,255,.06);border:1px solid var(--edge);color:var(--text);transition:border-color .2s,box-shadow .2s}
.lock input:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.lock button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;font-weight:600;background:linear-gradient(135deg,var(--a),var(--b));color:var(--on);transition:transform .15s,filter .2s}
.lock button:hover{filter:brightness(1.1)}
.lock button:active{transform:scale(.98)}
.lock .err{min-height:1.2em;margin-top:14px;font-size:.85rem;color:#fda4af}
.lock .show{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:.85rem;color:var(--muted);cursor:pointer}.lock .show input{width:auto;padding:0;letter-spacing:normal}.lock #user{margin-bottom:12px}
.lock .tabs2{display:flex;gap:8px;margin-bottom:22px}.lock .tabs2 button{flex:1;margin:0;padding:10px;background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--edge);font-size:.85rem}.lock .tabs2 button.sel{background:linear-gradient(135deg,var(--a),var(--b));color:var(--on);border-color:transparent}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
</style>
</head>

<body>

<!-- ============ LOCK SCREEN ============ -->
<main class="lock">

.panel{padding:22px;margin-bottom:26px}
.panel h3,.sec{font-size:1.1rem;font-weight:600}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}

.log p{margin:0 0 6px;word-break:break-word}.log b{color:var(--a)}
.rm{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.scr{position:relative;flex:2 1 420px;min-width:0;aspect-ratio:16/9;border-radius:14px;background:#000;border:1px solid var(--edge);overflow:hidden;display:grid;place-items:center;text-align:center}
.scr.mini{aspect-ratio:auto;min-height:150px;flex:1 1 100%}

.rm>div:last-child{flex:1 1 260px;min-width:0}

.tabs{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}

<div><div id="pg"></div><div id="lg"></div><div class="row"><input class="f" id="gi" maxlength="60" placeholder="Type your guess"><button class="b" id="gs">Send</button></div></div></div></div>
<script>
var $=function(i){return document.getElementById(i)};
var P=null,hc=null,isH=false,conns={},me={id:'',name:''},players=[],drawer='',ph='home',code='';
var WORDS='apple,house,tree,car,dog,cat,pizza,guitar,rocket,castle,bridge,robot,dragon,banana,umbrella,bicycle,island,volcano,snowman,butterfly,rainbow,camera,clock,key,moon,spider,train,whale,cactus,crown,ghost,hamburger,lighthouse,mountain,pirate,penguin,sandwich,sword,telescope,tornado,wizard,zebra,airplane,backpack,candle,diamond,elephant,fireworks,giraffe,headphones,igloo,jellyfish,kangaroo,ladder,microphone,ninja,octopus,pyramid,skateboard,tent,vampire,windmill'.split(',');
function newH(){return{players:{},order:[],round:1,rounds:3,time:80,turn:0,word:'',guessed:{},left:0,tm:null,pk:null,pool:[],phase:'lobby',drawer:'',cands:[],rv:[],rev:0}}
var H=newH();
function show(id){['home','lobby','game'].forEach(function(x){$(x).hidden=x!==id})}
function err(t){$('er').textContent=t}
function nm(){try{return String(parent.__K.user||'Player').slice(0,16)}catch(e){return 'Player'}}
function pn(id){for(var i=0;i<players.length;i++)if(players[i].id===id)return players[i].n;return 'Someone'}
function parseWords(t){return t.split(String.fromCharCode(10)).join(',').split(',').map(function(w){return w.trim().toLowerCase()}).filter(function(w){return w&&w.length<=24})}
function load(cb){if(window.Peer)return cb();var u=['https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js','https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'],i=0;(function n(){var s=document.createElement('script');s.src=u[i];s.onload=cb;s.onerror=function(){if(++i<u.length)n();else err('Could not load the connection library.')};document.head.appendChild(s)})()}
function rc(){var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',c='';for(var i=0;i<5;i++)c+=A.charAt(Math.random()*A.length|0);return c}

/* ---- canvas ---- */
var cv=$('cv'),cx=cv.getContext('2d');cv.width=800;cv.height=500;

var down=false,lp=null,buf=[],col='#000000';
['#000000','#e11d48','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6','#ffffff'].forEach(function(c){var b=document.createElement('button');b.className='sw';b.style.background=c;b.onclick=function(){col=c};$('cols').appendChild(b)});
function canDraw(){return me.id===drawer&&ph==='draw'}
function pt(e){var r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
function mv(e){var q=pt(e),s={a:lp[0],b:lp[1],x:q[0],y:q[1],c:col,w:+$('sz').value};seg(s);buf.push(s);lp=q;if(buf.length>=6)flush()}
function flush(){if(!buf.length)return;send({t:'d',a:buf});buf=[]}
cv.onpointerdown=function(e){if(!canDraw())return;down=true;lp=pt(e);cv.setPointerCapture(e.pointerId);mv(e)};
cv.onpointermove=function(e){if(down)mv(e)};
cv.onpointerup=cv.onpointercancel=function(){down=false;flush()};
$('cl').onclick=function(){if(!canDraw())return;clr();send({t:'clr'})};

/* ---- messaging ---- */
function send(m){if(isH)hostRecv('host',m);else if(hc&&hc.open)hc.send(m)}
function toAll(m,except){Object.keys(conns).forEach(function(k){if(k!==except&&conns[k].open)conns[k].send(m)});if(except!=='host')recv(m)}
function toOne(id,m){if(id==='host')recv(m);else if(conns[id]&&conns[id].open)conns[id].send(m)}
function ch(m){var p=document.createElement('p'),l=$('lg');p.className=m.c||'';if(m.n){var b=document.createElement('b');b.textContent=m.n+': ';p.appendChild(b)}p.appendChild(document.createTextNode(m.x));l.appendChild(p);l.scrollTop=l.scrollHeight}
function rp(){var s=players.slice().sort(function(a,b){return b.s-a.s});['pl','pg'].forEach(function(id){var e=$(id);e.textContent='';s.forEach(function(p){var d=document.createElement('div');d.className='p';d.textContent=(p.id===drawer?'\u270F ':'')+(p.g?'\u2713 ':'')+p.n+(p.id===me.id?' (you)':'')+' - '+p.s;e.appendChild(d)})})}
function recv(m){var t=m.t;
 if(t==='players'){players=m.l;drawer=m.d;rp();if(ph==='pick')$('wd').textContent=pn(drawer)+' is choosing a word...'}
 else if(t==='phase'){ph=m.ph;drawer=m.d;$('rd').textContent='Round '+m.r+'/'+m.n;$('pk').hidden=true;
  if(ph==='lobby'||ph==='end'){show('lobby');$('lt').textContent=ph==='end'?'Game over':'Lobby';$('hs').hidden=!isH;$('wt').hidden=isH;$('tm').textContent=''}
  else{show('game');$('tools').hidden=!(ph==='draw'&&me.id===drawer);if(ph==='pick')$('wd').textContent=pn(drawer)+' is choosing a word...'}}
 else if(t==='choose'){var k=$('pk');k.textContent='';var h=document.createElement('b');h.textContent='Pick a word to draw';k.appendChild(h);m.w.forEach(function(w){var b=document.createElement('button');b.className='b';b.textContent=w;b.onclick=function(){k.hidden=true;send({t:'pick',w:w})};k.appendChild(b)});k.hidden=false}
 else if(t==='word'||t==='hint')$('wd').textContent=m.w||m.h;
 else if(t==='tick')$('tm').textContent=m.s+'s';
 else if(t==='d')m.a.forEach(seg);
 else if(t==='clr')clr();
 else if(t==='chat')ch(m)}

/* ---- host game logic ---- */
function sync(){toAll({t:'players',l:Object.keys(H.players).map(function(k){return{id:k,n:H.players[k].n,s:H.players[k].s,g:!!H.guessed[k]}}),d:H.drawer})}
function mask(){return H.word.split('').map(function(c,i){return c===' '?'/':(H.rv.slice(0,H.rev).indexOf(i)>=0?c:'_')}).join(' ')}
function start(){var cw=parseWords($('cw').value),pool=($('co').checked&&cw.length>=3)?cw:cw.concat(WORDS);
 if(Object.keys(H.players).length<2){$('lm').textContent='You need at least 2 players.';return}
 $('lm').textContent='';H.pool=pool;H.rounds=+$('rn').value;H.time=+$('tl').value;H.round=1;H.turn=0;H.order=Object.keys(H.players);
 Object.keys(H.players).forEach(function(k){H.players[k].s=0});nextTurn()}
function nextTurn(){H.order=H.order.filter(function(k){return H.players[k]});
 if(H.turn>=H.order.length){H.round++;H.turn=0}
 if(H.round>H.rounds||H.order.length<2)return over();
 H.drawer=H.order[H.turn++];H.phase='pick';H.guessed={};H.word='';
 var c=[];while(c.length<3&&c.length<H.pool.length){var w=H.pool[Math.random()*H.pool.length|0];if(c.indexOf(w)<0)c.push(w)}
 H.cands=c;toAll({t:'clr'});toAll({t:'phase',ph:'pick',d:H.drawer,r:H.round,n:H.rounds});sync();toOne(H.drawer,{t:'choose',w:c});
 clearTimeout(H.pk);H.pk=setTimeout(function(){if(H.phase==='pick')beginDraw(c[0])},15000)}
function beginDraw(w){clearTimeout(H.pk);H.word=w;H.phase='draw';H.left=H.time;H.rev=0;H.rv=[];
 for(var i=0;i<w.length;i++)if(w[i]!==' ')H.rv.push(i);H.rv.sort(function(){return Math.random()-.5});
 toAll({t:'phase',ph:'draw',d:H.drawer,r:H.round,n:H.rounds});toOne(H.drawer,{t:'word',w:w});toAll({t:'hint',h:mask()},H.drawer);toAll({t:'tick',s:H.left});
 clearInterval(H.tm);H.tm=setInterval(function(){H.left--;toAll({t:'tick',s:H.left});
  if(H.left===Math.floor(H.time*.5)||H.left===Math.floor(H.time*.25)){H.rev++;toAll({t:'hint',h:mask()},H.drawer)}
  if(H.left<=0)endTurn()},1000)}
function endTurn(){if(H.phase!=='draw')return;H.phase='reveal';clearInterval(H.tm);
 toAll({t:'chat',n:'',x:'The word was: '+H.word,c:'sys'});toAll({t:'phase',ph:'reveal',d:H.drawer,r:H.round,n:H.rounds});toAll({t:'hint',h:H.word});toAll({t:'tick',s:0});sync();setTimeout(nextTurn,4000)}
function over(){H.phase='end';clearInterval(H.tm);clearTimeout(H.pk);toAll({t:'phase',ph:'end',d:'',r:H.rounds,n:H.rounds});sync()}
function left(id){var p=H.players[id];if(!p)return;var ix=H.order.indexOf(id);if(ix>=0&&ix<H.turn)H.turn--;
 delete H.players[id];delete conns[id];H.order=H.order.filter(function(k){return k!==id});
 toAll({t:'chat',n:'',x:p.n+' left',c:'sys'});sync();
 if(H.phase==='draw'&&id===H.drawer)endTurn();else if(H.phase==='pick'&&id===H.drawer){clearTimeout(H.pk);nextTurn()}}
function hostRecv(id,m){var pl=H.players[id],t=m.t;
 if(t==='join'){H.players[id]={n:String(m.n||'Player').slice(0,16),s:0};if(H.order.indexOf(id)<0)H.order.push(id);
  toOne(id,{t:'phase',ph:H.phase==='draw'||H.phase==='pick'||H.phase==='reveal'?H.phase:H.phase,d:H.drawer,r:H.round,n:H.rounds});
  toAll({t:'chat',n:'',x:H.players[id].n+' joined',c:'sys'});sync();if(H.phase==='draw')toOne(id,{t:'hint',h:mask()});return}
 if(!pl)return;
 if(t==='pick'){if(id===H.drawer&&H.phase==='pick'&&H.cands.indexOf(m.w)>=0)beginDraw(m.w)}
 else if(t==='d'){if(id===H.drawer&&H.phase==='draw'&&Array.isArray(m.a))toAll({t:'d',a:m.a.slice(0,20)},id)}
 else if(t==='clr'){if(id===H.drawer)toAll({t:'clr'},id)}
 else if(t==='g'){var x=String(m.x||'').slice(0,60).trim();if(!x)return;
  if(H.phase==='draw'&&id!==H.drawer&&!H.guessed[id]&&x.toLowerCase()===H.word.toLowerCase()){
   var pts=50+Math.round(150*H.left/H.time);pl.s+=pts;if(H.players[H.drawer])H.players[H.drawer].s+=30;H.guessed[id]=1;
   toAll({t:'chat',n:'',x:pl.n+' guessed the word! (+'+pts+')',c:'ok'});sync();
   if(H.order.every(function(k){return k===H.drawer||!H.players[k]||H.guessed[k]}))endTurn();return}
  if(H.phase==='draw'&&(id===H.drawer||H.guessed[id])){Object.keys(H.players).forEach(function(k){if(k===H.drawer||H.guessed[k])toOne(k,{t:'chat',n:pl.n,x:x,c:'dim'})});return}
  toAll({t:'chat',n:pl.n,x:x})}}

/* ---- connect ---- */
function create(){me.name=nm();load(function(){code=rc();isH=true;me.id='host';P=new Peer('madskrib-'+code);
 P.on('open',function(){H.players.host={n:me.name,s:0};H.order=['host'];$('rc').textContent=code;H.phase='lobby';recv({t:'phase',ph:'lobby',d:'',r:1,n:3});sync()});
 P.on('connection',function(c){c.on('open',function(){conns[c.peer]=c});c.on('data',function(m){hostRecv(c.peer,m)});c.on('close',function(){left(c.peer)})});
 P.on('error',function(e){if(e.type==='unavailable-id'){P.destroy();create()}else err('Connection error: '+e.type)})})}
function join(){var c=$('jc').value.trim().toUpperCase();if(!c)return err('Type a room code first.');me.name=nm();err('Joining...');
 load(function(){P=new Peer();P.on('open',function(id){me.id=id;hc=P.connect('madskrib-'+c,{reliable:true});
  var to=setTimeout(function(){err('No room found with that code.')},12000);
  hc.on('open',function(){clearTimeout(to);code=c;$('rc').textContent=c;err('');hc.send({t:'join',n:me.name})});
  hc.on('data',recv);hc.on('close',function(){leave();err('The host closed the room.')})});
 P.on('error',function(e){err(e.type==='peer-unavailable'?'No room found with that code.':'Connection error: '+e.type)})})}
function leave(){clearInterval(H.tm);clearTimeout(H.pk);try{P.destroy()}catch(e){}P=null;hc=null;conns={};H=newH();isH=false;ph='home';players=[];$('lg').textContent='';show('home')}
$('mk').onclick=create;$('jn').onclick=join;$('lv').onclick=leave;$('st').onclick=start;
function guess(){var i=$('gi'),x=i.value.trim();if(!x)return;i.value='';send({t:'g',x:x})}
$('gs').onclick=guess;$('gi').onkeydown=function(e){if(e.key==='Enter')guess()};
$('jc').onkeydown=function(e){if(e.key==='Enter')join()};
</script></template>


<template id="wmdoc"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#10131c;color:#fff;font:14px system-ui,sans-serif;display:grid;justify-items:center;padding:8px}
.t{display:flex;justify-content:space-between;width:min(100%,360px);padding:4px 2px;font-weight:600}

<div class="t"><span>Score <b id="s">0</b></span><span>Next <b id="nx"></b></span><span>Best <b id="b">0</b></span></div>
<canvas id="c" width="360" height="540"></canvas>
<div id="o" hidden><h2>Game over</h2><p>Score: <b id="fs"></b></p><button id="r">Play again</button></div>
<script>
var $=function(i){return document.getElementById(i)},c=$('c'),x=c.getContext('2d'),W=360,H=540,LINE=95;
var R=[13,18,23,29,36,44,53,63,74,86,100],E=['🍒','🍓','🍇','🍊','🍎','🍐','🍑','🍍','🥭','🍈','🍉'];
var C=['#e11d48','#f43f5e','#8b5cf6','#fb923c','#ef4444','#a3e635','#fdba74','#facc15','#fbbf24','#86efac','#22c55e'];
var balls,score,best=0,over,cur,nxt,cd,mx=W/2,ot=0;
try{best=+localStorage.getItem('wmbest')||0}catch(e){}
function rl(){return Math.random()*5|0}
function ui(){$('s').textContent=score;$('b').textContent=best;$('nx').textContent=E[nxt]}
function reset(){balls=[];score=0;over=false;cd=0;ot=0;cur=rl();nxt=rl();ui();$('o').hidden=true}
function drop(){if(over||cd>0)return;balls.push({x:Math.max(R[cur],Math.min(W-R[cur],mx)),y:R[cur]+4,vx:0,vy:0,l:cur,r:R[cur],age:0,dead:false});cur=nxt;nxt=rl();cd=30;ui()}
function end(){over=true;if(score>best){best=score;try{localStorage.setItem('wmbest',best)}catch(e){}}$('fs').textContent=score;ui();$('o').hidden=false}
function step(){var news=[];
 balls.forEach(function(b){b.age++;b.vy+=.4;b.x+=b.vx;b.y+=b.vy;b.vx*=.995;b.vy*=.995;
  if(b.x<b.r){b.x=b.r;b.vx*=-.3}if(b.x>W-b.r){b.x=W-b.r;b.vx*=-.3}if(b.y>H-b.r){b.y=H-b.r;b.vy*=-.2;b.vx*=.98}});
 for(var it=0;it<3;it++)for(var i=0;i<balls.length;i++)for(var j=i+1;j<balls.length;j++){
  var a=balls[i],d2=balls[j];if(a.dead||d2.dead)continue;
  var dx=d2.x-a.x,dy=d2.y-a.y,d=Math.sqrt(dx*dx+dy*dy),m=a.r+d2.r;
  if(d<m&&d>.001){
   if(a.l===d2.l&&a.l<10){a.dead=d2.dead=true;var l=a.l+1;score+=l*10+10;
    news.push({x:(a.x+d2.x)/2,y:(a.y+d2.y)/2,vx:(a.vx+d2.vx)/2,vy:(a.vy+d2.vy)/2,l:l,r:R[l],age:0,dead:false});ui()}
   else{var o=(m-d)/2,nx=dx/d,ny=dy/d;a.x-=nx*o;a.y-=ny*o;d2.x+=nx*o;d2.y+=ny*o;
    var rv=(d2.vx-a.vx)*nx+(d2.vy-a.vy)*ny;if(rv<0){a.vx+=nx*rv*.5;a.vy+=ny*rv*.5;d2.vx-=nx*rv*.5;d2.vy-=ny*rv*.5}}}}
 balls=balls.filter(function(b){return!b.dead}).concat(news);
 var up=balls.some(function(b){return b.age>90&&b.y-b.r<LINE});ot=up?ot+1:0;if(ot>150)end();if(cd>0)cd--}
function ball(px,py,l){x.fillStyle=C[l];x.beginPath();x.arc(px,py,R[l],0,7);x.fill();x.font=(R[l]*1.15)+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(E[l],px,py+R[l]*.06)}
function draw(){x.clearRect(0,0,W,H);x.strokeStyle='#ff5f6d88';x.setLineDash([6,6]);x.beginPath();x.moveTo(0,LINE);x.lineTo(W,LINE);x.stroke();x.setLineDash([]);
 if(!over&&cd<=0){x.globalAlpha=.55;ball(Math.max(R[cur],Math.min(W-R[cur],mx)),32,cur);x.globalAlpha=1}
 balls.forEach(function(b){ball(b.x,b.y,b.l)})}

c.onpointermove=setx;c.onpointerdown=setx;c.onpointerup=function(e){setx(e);drop()};

</script></template>

<div id="home" class="c"><h2>Gartic Phone <span class="m">(CUSTOM)</span></h2>

<template id="owner">
<style>
body{height:auto;padding:clamp(12px,4vw,24px)}
.w{width:min(860px,100%);margin:0 auto;display:grid;gap:18px}
.w h1{font-size:1.8rem}.w h3{margin-bottom:12px;font-size:1.05rem}
.box{padding:22px}.box p,.note{color:var(--muted);font-size:.85rem;margin-top:10px}
.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.f{flex:1;min-width:130px;padding:11px 16px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:var(--text);font:inherit}
select.f option{color:#000}
textarea.f{border-radius:14px;min-height:110px;width:100%}
.b{padding:10px 20px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.1);font-weight:600;font-size:.88rem}
.b:hover{background:rgba(255,255,255,.2)}
.ck{display:flex;gap:6px;align-items:center;font-size:.9rem}
</style>
<div class="w">
<h1>Owner panel</h1><p class="note" id="st">Changes save on this device. Use Export at the bottom to apply them to everyone.</p>

<div class="box glass"><h3>Site control <span id="stt" style="margin-left:8px;font-size:.85rem"></span></h3>
<div class="r"><input class="f" id="dm" placeholder="Message shown while the site is down (optional)"></div>
<div class="r"><button class="b" id="dn">Close site</button><button class="b" id="up">Reopen site</button></div>
<p>Users on the site see a "Site is down temporarily" screen right away. Reopening brings them back live. Owner login always works.</p></div>

<div class="box glass"><h3>Active users <span id="ucnt" style="font-size:.85rem;color:var(--muted)"></span></h3>
<div id="ul"></div><div class="r"><button class="b" id="kall">Kick everyone</button></div>
<p>Shows people on the user site in the last couple of minutes. Kick removes them (they can sign back in). Ban blocks their username.</p></div>

<div class="box glass"><h3>Broadcast and chat</h3>
<div class="r"><input class="f" id="pm" maxlength="200" placeholder="Pop-up message to everyone"><button class="b" id="psend">Send pop-up</button></div>
<div class="r"><input class="f" id="bm" maxlength="200" placeholder="Live banner on the home page"><button class="b" id="bset">Set banner</button><button class="b" id="bclr">Clear banner</button></div>
<div class="r"><button class="b" id="clk">Lock chat and screen sharing</button><button class="b" id="ulk">Unlock</button></div></div>

<div class="box glass"><h3>All accounts <span id="acnt" style="font-size:.85rem;color:var(--muted)"></span></h3>
<div class="r"><select class="f" id="tmin" style="flex:none;width:auto"><option value="1">1 minute</option><option value="5">5 minutes</option><option value="15">15 minutes</option><option value="60">1 hour</option><option value="360">6 hours</option><option value="1440">1 day</option></select><span class="note" style="margin:0">Length used by the Timeout buttons.</span></div>
<div id="al"></div>
<p>Everyone who signed up appears here (it fills in while this panel is open). Reset password sets a new one for them. Accounts are saved to the Export box below, so paste it into DEFAULT_CFG to make them permanent.</p></div>

<div class="box glass"><h3>Banned usernames</h3>
<div class="r"><input class="f" id="bi" placeholder="Username to ban"><button class="b" id="bbtn">Ban</button></div><div id="bl"></div></div>

<div class="box glass"><h3>Site settings</h3>
<div class="r"><input class="f" id="msg" placeholder="Announcement banner on home page"></div>
<div class="r"><input class="f" id="ttl" placeholder="Tab title"><input class="f" id="ver" placeholder="Version text (e.g. 0.03v)"></div>
<div class="r"><select class="f" id="th"></select></div>
<div class="r"><button class="b" id="save1">Save settings</button></div></div>

<div class="box glass"><h3>Sections shown to users</h3><div class="r" id="secs"></div></div>

<div class="box glass"><h3>Links</h3>
<div class="r"><select class="f" id="ls"><option>games</option><option>proxies</option><option>ai</option><option>movies</option><option>tools</option></select>
<input class="f" id="ln" placeholder="Name"><input class="f" id="lu" placeholder="https://..."></div>
<div class="r"><button class="b" id="addl">Add link</button><button class="b" id="hidel">Hide default link with this name</button><button class="b" id="unh">Unhide all</button></div>
<div id="links"></div><p id="dels"></p></div>

<div class="box glass"><h3>Global chat</h3>
<div class="r"><input class="f" id="ot" maxlength="300" placeholder="Post as OWNER"><button class="b" id="say">Post</button></div>
<div class="r"><button class="b" id="clr">Clear chat history on this device</button></div></div>

<div class="box glass"><h3>Export config</h3>
<textarea class="f" id="exp" readonly></textarea>
<div class="r"><button class="b" id="cp">Copy</button><button class="b" id="rst">Reset owner config</button></div>
<p>Paste the copied text into <b>DEFAULT_CFG</b> in your file to apply it for everyone.</p></div>
</div>
<script>
(function(){
var K='madowner_cfg',C=JSON.parse(JSON.stringify(window.__CFG||{})),$=function(i){return document.getElementById(i)};
var SEC=['games','proxies','share','notes','movies','tools','ai','chat','settings'],TH=['midnight','ocean','sunset','forest','henry','rose','slate','rainbow'];
function norm(){C.hide=C.hide||[];C.links=C.links||{};C.del=C.del||{}}
function fill(){$('msg').value=C.msg||'';$('ttl').value=C.title||'';$('ver').value=C.ver||'';$('th').value=C.theme||'midnight'}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e}
function paint(){
 var s=$('secs');s.textContent='';
 SEC.forEach(function(id){var l=el('label','ck'),c=el('input');c.type='checkbox';c.checked=C.hide.indexOf(id)<0;
  c.onchange=function(){C.hide=C.hide.filter(function(x){return x!==id});if(!c.checked)C.hide.push(id);save()};
  l.appendChild(c);l.appendChild(document.createTextNode(id));s.appendChild(l)});
 var L=$('links');L.textContent='';
 Object.keys(C.links).forEach(function(id){C.links[id].forEach(function(x,i){
  var r=el('div','r'),d=el('button','b','Remove');d.onclick=function(){C.links[id].splice(i,1);save()};
  r.appendChild(el('span','',id+': '+x.n+' - '+x.u));r.appendChild(d);L.appendChild(r)})});
 var h=Object.keys(C.del).filter(function(id){return C.del[id].length}).map(function(id){return id+': '+C.del[id].join(', ')});
 $('dels').textContent=h.length?'Hidden defaults - '+h.join(' | '):'';
 $('exp').value=JSON.stringify(C);
}
function save(m){try{localStorage.setItem(K,JSON.stringify(C))}catch(e){}$('st').textContent=m||'Saved. Reopen the user site to see it.';paint()}
TH.forEach(function(t){var o=el('option','',t);o.value=t;$('th').appendChild(o)});
norm();fill();paint();
$('save1').onclick=function(){C.msg=$('msg').value.trim();C.title=$('ttl').value.trim();C.ver=$('ver').value.trim();C.theme=$('th').value;
 try{localStorage.setItem('mad_theme',JSON.stringify(C.theme))}catch(e){}document.documentElement.dataset.theme=C.theme;save()};
$('addl').onclick=function(){var id=$('ls').value,n=$('ln').value.trim(),u=$('lu').value.trim();if(!n||!u)return;
 if(!/^https?:\/\//i.test(u))u='https://'+u;(C.links[id]=C.links[id]||[]).push({n:n,u:u,d:'Added by owner'});$('ln').value=$('lu').value='';save()};
$('hidel').onclick=function(){var id=$('ls').value,n=$('ln').value.trim();if(!n)return;(C.del[id]=C.del[id]||[]).push(n);$('ln').value='';save()};
$('unh').onclick=function(){C.del={};save()};
$('say').onclick=function(){var t=$('ot').value.trim();if(!t)return;
 fetch('https://ntfy.sh/mad-global-chat-9xq4k2',{method:'POST',body:JSON.stringify({n:'OWNER',t:t.slice(0,300),c:'#C5B358'})})
 .then(function(){$('ot').value='';$('st').textContent='Posted to global chat.'}).catch(function(){$('st').textContent='Could not post.'})};
$('clr').onclick=function(){try{localStorage.removeItem('mad_gchat')}catch(e){}$('st').textContent='Cleared saved chat on this device.'};
$('cp').onclick=function(){$('exp').select();try{navigator.clipboard.writeText($('exp').value)}catch(e){}$('st').textContent='Copied.'};
$('rst').onclick=function(){if(!confirm('Reset owner config?'))return;try{localStorage.removeItem(K)}catch(e){}C={};norm();fill();save('Reset.')};

/* ---- live commands ---- */
var Q=window.__K||{},U={},bans=[],tmo={},isDown=0;
function ctl(o){o.key=Q.key;return fetch('https://ntfy.sh/'+Q.ctl,{method:'POST',body:JSON.stringify(o)}).then(function(){$('st').textContent='Command sent.'}).catch(function(){$('st').textContent='Could not send. Check your internet.'})}
function sse(t,since,fn){try{var es=new EventSource('https://ntfy.sh/'+t+'/sse?since='+since);es.onmessage=function(e){try{var d=JSON.parse(e.data);if(d.event==='message')fn(d,JSON.parse(d.message))}catch(x){}}}catch(x){}}
function drawU(){var L=$('ul'),n=Date.now()/1000,ids=Object.keys(U).filter(function(i){return n-U[i].s<130});L.textContent='';$('ucnt').textContent=ids.length+' active';
 ids.forEach(function(i){var u=U[i],r=el('div','r'),k=el('button','b','Kick'),b=el('button','b','Ban');
  k.onclick=function(){ctl({k:'kick',id:i})};b.onclick=function(){ctl({k:'ban',u:String(u.u).toLowerCase()});ctl({k:'kick',id:i})};
  r.appendChild(el('span','',u.u+' | '+u.d+' | on '+u.p+' | '+Math.round(n-u.s)+'s ago'));var t2=el('button','b','Timeout');t2.onclick=function(){ctl({k:'timeout',u:String(u.u).toLowerCase(),until:Math.floor(Date.now()/1000)+(+$('tmin').value)*60});ctl({k:'kick',id:i})};r.appendChild(k);r.appendChild(t2);r.appendChild(b);L.appendChild(r)})}
function drawS(){$('stt').textContent=isDown?'Site is DOWN':'Site is LIVE';$('stt').style.color=isDown?'#fda4af':'#86efac';var L=$('bl');L.textContent='';
 bans.forEach(function(u){var r=el('div','r'),b=el('button','b','Unban');b.onclick=function(){ctl({k:'unban',u:u})};r.appendChild(el('span','',u));r.appendChild(b);L.appendChild(r)})}
sse(Q.pres,'4m',function(d,o){if(!o||!o.id)return;if(o.t===0)delete U[o.id];else U[o.id]={u:o.u,p:o.p,d:o.d,s:d.time};drawU()});
sse(Q.ctl,'all',function(d,o){if(!o||o.key!==Q.key)return;if(o.k==='down')isDown=1;else if(o.k==='up')isDown=0;else if(o.k==='ban'&&bans.indexOf(o.u)<0)bans.push(o.u);else if(o.k==='unban')bans=bans.filter(function(x){return x!==o.u});else if(o.k==='timeout')tmo[o.u]=+o.until||0;else if(o.k==='untimeout')delete tmo[o.u];drawS();drawA()});
setInterval(function(){drawU();drawA()},5000);drawS();drawU();
$('dn').onclick=function(){ctl({k:'down',t:$('dm').value.trim().slice(0,200)})};
$('up').onclick=function(){ctl({k:'up'})};
$('kall').onclick=function(){if(confirm('Kick everyone off the site?'))ctl({k:'kick',id:'*'})};
$('psend').onclick=function(){var t=$('pm').value.trim();if(t){ctl({k:'popup',t:t.slice(0,200)});$('pm').value=''}};
$('bset').onclick=function(){ctl({k:'banner',t:$('bm').value.trim().slice(0,200)})};
$('bclr').onclick=function(){ctl({k:'banner',t:''});$('bm').value=''};
$('clk').onclick=function(){ctl({k:'lock'})};$('ulk').onclick=function(){ctl({k:'unlock'})};
$('bbtn').onclick=function(){var u=$('bi').value.trim().toLowerCase();if(u){ctl({k:'ban',u:u});$('bi').value=''}};

/* ---- accounts ---- */
var R={};try{R=JSON.parse(localStorage.getItem('madowner_accts')||'{}')}catch(e){}
(window.__CFG.accounts||[]).forEach(function(a){if(!R[a.u])R[a.u]={d:a.d,h:a.h}});
function saveR(){try{localStorage.setItem('madowner_accts',JSON.stringify(R))}catch(e){}C.accounts=Object.keys(R).map(function(k){return{u:k,d:R[k].d,h:R[k].h}});try{localStorage.setItem(K,JSON.stringify(C))}catch(e){}$('exp').value=JSON.stringify(C);drawA()}
function acc(o){o.key=Q.key;return fetch('https://ntfy.sh/'+Q.acc,{method:'POST',body:JSON.stringify(o)}).catch(function(){})}
function drawA(){var L=$('al'),n=Date.now()/1000,ks=Object.keys(R).sort();L.textContent='';$('acnt').textContent=ks.length+' accounts';
 ks.forEach(function(k){var a=R[k],on=false,bn=bans.indexOf(k)>=0;
  Object.keys(U).forEach(function(i){if(String(U[i].u).toLowerCase()===k&&n-U[i].s<130)on=true});
  var r=el('div','r'),tag=bn?' [BANNED]':(tmo[k]>n?' [timed out, '+Math.ceil((tmo[k]-n)/60)+' min left]':'');
  r.appendChild(el('span','',a.d+(on?' (online now)':'')+tag));
  var b1=el('button','b',bn?'Unban':'Ban');b1.onclick=function(){ctl({k:bn?'unban':'ban',u:k})};
  var b2=el('button','b','Timeout');b2.onclick=function(){ctl({k:'timeout',u:k,until:Math.floor(Date.now()/1000)+(+$('tmin').value)*60})};
  var b3=el('button','b','Clear timeout');b3.onclick=function(){ctl({k:'untimeout',u:k})};
  var b4=el('button','b','Reset password');b4.onclick=function(){var p=prompt('New password for '+a.d+' (4+ characters):');if(!p||p.length<4)return;hashPw(k,p).then(function(h){R[k].h=h;saveR();acc({k:'reset',u:k,h:h});$('st').textContent='Password reset for '+a.d+'.'})};
  r.appendChild(b1);r.appendChild(b2);r.appendChild(b3);r.appendChild(b4);L.appendChild(r)})}
sse(Q.acc,'all',function(d,o){if(!o||o.key!==Q.key)return;var k=String(o.u||'').toLowerCase();if(o.k==='acct'&&!R[k])R[k]={d:String(o.d||k).slice(0,20),h:o.h};else if(o.k==='reset'&&R[k])R[k].h=o.h;else return;saveR()});
saveR();
})();
</script>
</template>

<script>
/* ================= SETTINGS ================= */
var OWNER_USER  = "mad";           // owner login (not case sensitive)
var OWNER_PASS  = "maddex2012";    // owner password (not case sensitive)
var TAB_TITLE   = "Home";          // title shown on the about:blank tab
var DEFAULT_CFG = {};              // paste the Owner panel's exported config here to apply it to everyone
/* shared channels between the owner panel and the site (keep these private) */
var CTL_TOPIC = "mad-ctl-7h3k9w2pq", PRES_TOPIC = "mad-pres-7h3k9w2pq", ACC_TOPIC = "mad-acc-7h3k9w2pq", CTL_KEY = "mk_4f9a1c7e2b";
var RESERVED = ['mad','owner','system','admin','host','guest'];

/* ================= LOGIC ================= */
var input  = document.getElementById('code');
var userIn = document.getElementById('user');
var err    = document.getElementById('err');
var card   = document.getElementById('card');
var tIn = document.getElementById('tIn'), tUp = document.getElementById('tUp'), mode = 'in';

function savedTheme(){
  try{ return JSON.parse(localStorage.getItem('mad_theme')) || 'midnight'; }catch(e){ return 'midnight'; }
}
function getCfg(){
  try{ var c = JSON.parse(localStorage.getItem('madowner_cfg')); if (c) return c; }catch(e){}
  return DEFAULT_CFG;
}
document.documentElement.dataset.theme = savedTheme();

/* passwords are never stored in plain text: only a hash (not case sensitive) */
function cyrb(s){
  var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (var i = 0, c; i < s.length; i++){ c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 'c' + (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}
function hashPw(u, p){
  var s = String(u).toLowerCase() + ':' + String(p).toLowerCase() + ':mad1';
  try{
    if (window.crypto && crypto.subtle && window.TextEncoder)
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(b){
        return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
      });
  }catch(e){}
  return Promise.resolve(cyrb(s));
}

function buildSite(id, user){
  var cfg = getCfg();
  var K = {ctl:CTL_TOPIC, pres:PRES_TOPIC, acc:ACC_TOPIC, key:CTL_KEY, user:user};
  var esc = function(t){ return t.replace(/</g, '\\u003c'); };
  var inj = 'window.__CFG=' + esc(JSON.stringify(cfg)) + ';window.__K=' + esc(JSON.stringify(K)) + ';' + cyrb.toString() + ';' + hashPw.toString() + ';';
  return '<!DOCTYPE html><html lang="en" data-theme="' + savedTheme() + '"><head><meta charset="UTF-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' +
    '<title>' + (id === 'owner' ? 'Owner' : (cfg.title || TAB_TITLE)) + '</title><style>' +
    document.getElementById('base').textContent +
    '</style></head><body><script>' + inj + '<\/script>' +
    document.getElementById(id).innerHTML +
    '</body></html>';
}

function localAcc(){ try{ return JSON.parse(localStorage.getItem('madacc')) || {}; }catch(e){ return {}; } }

/* all known accounts: this device, the owner's exported list, and the shared sign-up channel */
function getAccts(cb){
  var m = {}, L = localAcc(), done = false;
  Object.keys(L).forEach(function(k){ m[k] = L[k]; });
  (getCfg().accounts || []).forEach(function(a){ m[a.u] = {d:a.d, h:a.h}; });
  function fin(){ if(!done){ done = true; cb(m); } }
  setTimeout(fin, 5000);
  fetch('https://ntfy.sh/' + ACC_TOPIC + '/json?poll=1&since=all')
    .then(function(r){ return r.text(); })
    .then(function(t){
      t.split('\n').forEach(function(l){
        try{
          var d = JSON.parse(l), o = JSON.parse(d.message);
          if (d.event !== 'message' || !o || o.key !== CTL_KEY) return;
          var k = String(o.u || '').toLowerCase();
          if (o.k === 'acct' && !m[k]) m[k] = {d:String(o.d || k).slice(0, 20), h:o.h};
          else if (o.k === 'reset' && m[k]) m[k].h = o.h;
        }catch(e){}
      });
      fin();
    }).catch(fin);
}

/* owner commands saved on the channel: site down, bans, timeouts */
function getState(cb){
  var st = {down:0, msg:'', bans:[], to:{}}, done = false;
  function fin(){ if(!done){ done = true; cb(st); } }
  setTimeout(fin, 5000);
  fetch('https://ntfy.sh/' + CTL_TOPIC + '/json?poll=1&since=all')
    .then(function(r){ return r.text(); })
    .then(function(t){
      t.split('\n').forEach(function(l){
        try{
          var d = JSON.parse(l), o = JSON.parse(d.message);
          if (d.event !== 'message' || !o || o.key !== CTL_KEY) return;
          if (o.k === 'down'){ st.down = 1; st.msg = o.t || ''; }
          else if (o.k === 'up') st.down = 0;
          else if (o.k === 'ban' && st.bans.indexOf(o.u) < 0) st.bans.push(o.u);
          else if (o.k === 'unban') st.bans = st.bans.filter(function(x){ return x !== o.u; });
          else if (o.k === 'timeout') st.to[o.u] = +o.until || 0;
          else if (o.k === 'untimeout') delete st.to[o.u];
        }catch(e){}
      });
      fin();
    }).catch(fin);
}

function msg(t, ok){ err.textContent = t; err.style.color = ok ? '#86efac' : ''; }
function bad(m){
  msg(m);
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  input.value = ''; input.focus();
}

function setMode(m){
  mode = m;
  tIn.classList.toggle('sel', m === 'in'); tUp.classList.toggle('sel', m === 'up');
  document.getElementById('lh').textContent = m === 'in' ? 'Welcome back' : 'Create your account';
  document.getElementById('lp').textContent = m === 'in' ? 'Sign in to jump back in.' : "Pick a username and password. Please don't reuse a password from anywhere else.";
  userIn.placeholder = m === 'in' ? 'Username' : 'Username (recommended real name)';
  input.autocomplete = m === 'in' ? 'current-password' : 'new-password';
  document.getElementById('go').textContent = m === 'in' ? "Let's go" : 'Done';
  msg('');
}

function enter(role, name, w){
  var html = buildSite(role, name);
  if (w){ w.document.open(); w.document.write(html); w.document.close(); }
  else { document.open(); document.write(html); document.close(); }
  input.value = ''; msg('');
}

function signUp(){
  var u = userIn.value.trim(), p = input.value, k = u.toLowerCase();
  if (!/^[A-Za-z0-9 ._-]{2,20}$/.test(u)) return msg('Username: 2 to 20 letters, numbers, spaces, . _ or -');
  if (p.length < 4) return msg('Password needs at least 4 characters.');
  if (k === OWNER_USER || RESERVED.indexOf(k) >= 0) return msg('That username is reserved. Pick another one.');
  msg('Creating your account...');
  getAccts(function(m){
    if (m[k]) return msg('That username is taken. Try another one.');
    hashPw(k, p).then(function(h){
      var L = localAcc(); L[k] = {d:u, h:h};
      try{ localStorage.setItem('madacc', JSON.stringify(L)); }catch(e){}
      try{ fetch('https://ntfy.sh/' + ACC_TOPIC, {method:'POST', body:JSON.stringify({key:CTL_KEY, k:'acct', u:k, d:u, h:h})}).catch(function(){}); }catch(e){}
      setMode('in'); userIn.value = u; input.value = ''; input.focus();
      msg('Account created! Welcome aboard, ' + u + '. Sign in to get started.', true);
    });
  });
}

function signIn(){
  var u = userIn.value.trim().slice(0, 20), p = input.value, k = u.toLowerCase();
  if (u.length < 2 || !p) return msg('Enter your username and password.');
  var w = window.open('about:blank', '_blank');
  function fail(m){ if (w) w.close(); bad(m); }
  if (k === OWNER_USER && p.toLowerCase() === OWNER_PASS) return enter('owner', u, w);
  msg('Checking...');
  getAccts(function(m){
    var a = m[k];
    if (!a) return fail('Wrong username or password.');
    hashPw(k, p).then(function(h){
      if (h !== a.h) return fail('Wrong username or password.');
      getState(function(st){
        if (st.down){ if (w) w.close(); return msg('Site is down temporarily.' + (st.msg ? ' ' + st.msg : '')); }
        if (st.bans.indexOf(k) >= 0){ if (w) w.close(); return msg('This account is banned.'); }
        var left = (st.to[k] || 0) * 1000 - Date.now();
        if (left > 0){ if (w) w.close(); return msg('You are timed out for ' + Math.ceil(left / 60000) + ' more minute(s).'); }
        enter('app', a.d, w);
      });
    });
  });
}

function submitForm(){ if (mode === 'up') signUp(); else signIn(); }
tIn.addEventListener('click', function(){ setMode('in'); });
tUp.addEventListener('click', function(){ setMode('up'); });
document.getElementById('showpw').addEventListener('change', function(){ input.type = this.checked ? 'text' : 'password'; });
document.getElementById('go').addEventListener('click', submitForm);
input.addEventListener('keydown', function(e){ if (e.key === 'Enter') submitForm(); });
userIn.addEventListener('keydown', function(e){ if (e.key === 'Enter') input.focus(); });
</script>

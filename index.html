<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>

<!-- Shared styles: lock screen AND the about:blank site -->
<style id="base">
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap');
:root{--bg:#0a0e1c;--text:#eef1ff;--muted:#9aa3c7;--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.15);--a:#5eead4;--b:#a78bfa;--on:#0a0e1c}
/* ---- THEMES ---- */
[data-theme=ocean]{--bg:#041320;--a:#38bdf8;--b:#3b82f6;--on:#041320}
[data-theme=sunset]{--bg:#180a13;--a:#fb923c;--b:#f43f5e;--on:#180a13}
[data-theme=forest]{--bg:#06130d;--a:#4ade80;--b:#14b8a6;--on:#06130d}
[data-theme=henry]{--bg:#03160b;--a:#C5B358;--b:#1f8a4c;--on:#03160b;--muted:#a9b79a;--glass:rgba(197,179,88,.07);--edge:rgba(197,179,88,.28)}
[data-theme=rose]{--bg:#150a1c;--a:#f472b6;--b:#c084fc;--on:#150a1c}
[data-theme=slate]{--bg:#0d0f12;--a:#e2e8f0;--b:#64748b;--on:#0d0f12}
@property --h{syntax:'<number>';inherits:true;initial-value:0}
@keyframes hue{to{--h:360}}
[data-theme=rainbow]{--bg:#0b0b12;--a:hsl(var(--h) 90% 65%);--b:hsl(calc(var(--h) + 140) 90% 65%);--on:#0b0b12;animation:hue 14s steps(70) infinite}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
[hidden]{display:none!important}
html{scrollbar-gutter:stable}
body{font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow-x:clip;transition:background .4s}
body::before,body::after{content:"";position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.4;z-index:-1;animation:drift 22s ease-in-out infinite alternate}
body::before{background:var(--b);top:-18vmax;left:-12vmax}
body::after{background:var(--a);bottom:-22vmax;right:-14vmax;animation-delay:-8s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);border-radius:24px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<!-- Lock screen only -->
<style>
.lock{min-height:100%;display:grid;place-items:center;padding:24px}
.lock .glass{width:min(380px,100%);padding:40px 32px;text-align:center}
.lock h1{font-size:1.5rem;font-weight:600;margin-bottom:8px}
.lock p{color:var(--muted);font-size:.9rem;margin-bottom:26px}
.lock input{width:100%;padding:14px 16px;border-radius:14px;text-align:center;letter-spacing:.35em;font:inherit;background:rgba(255,255,255,.06);border:1px solid var(--edge);color:var(--text);transition:border-color .2s,box-shadow .2s}
.lock input:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.lock button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;font-weight:600;background:linear-gradient(135deg,var(--a),var(--b));color:var(--on);transition:transform .15s,filter .2s}
.lock button:hover{filter:brightness(1.1)}
.lock button:active{transform:scale(.98)}
.lock .err{height:1.2em;margin-top:14px;font-size:.85rem;color:#fda4af}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
</style>
</head>

<body>

<!-- ============ LOCK SCREEN ============ -->
<main class="lock">
  <div class="glass" id="card">
    <h1>Enter access code</h1>
    <p>Type your code to continue.</p>
    <input id="code" type="password" autocomplete="off" autofocus aria-label="Access code">
    <button id="go">Unlock</button>
    <div class="err" id="err" role="alert"></div>
  </div>
</main>

<!-- ============ THE USER SITE (loaded into about:blank) ============ -->
<template id="app">
<style>
body{height:auto;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:16px;z-index:10;margin:16px auto 0;width:min(1040px,calc(100% - 32px));display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 22px;border-radius:999px}
.brand{font-weight:700;font-size:1.05rem;background:none;border:0}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.1);font-weight:600;font-size:.88rem;transition:background .2s,opacity .3s,transform .3s}
.btn:hover{background:rgba(255,255,255,.2)}
.btn.hidden{opacity:0;pointer-events:none;transform:translateX(8px)}
main.stage{flex:1;width:min(1040px,calc(100% - 32px));margin:0 auto;padding:44px 0 40px}
.page{display:none}
.page.active{display:block;animation:in .3s ease}
.page.leaving{display:block;animation:out .18s ease forwards;pointer-events:none}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@keyframes out{to{opacity:0}}
.hero{text-align:center;padding:36px 0 42px}
.hero h1{font-size:clamp(2.2rem,6vw,3.8rem);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hero p{color:var(--muted);margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tile{padding:28px 24px;text-align:left;display:flex;flex-direction:column;gap:12px;transition:transform .25s,border-color .25s,background .25s}
.tile:hover{transform:translateY(-4px);border-color:var(--a);background:rgba(255,255,255,.1)}
.tile b{font-size:1.1rem;font-weight:600}
.tile .d{color:var(--muted);font-size:.85rem}
.ico{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;border:1px solid var(--edge);color:var(--a);background:linear-gradient(135deg,color-mix(in srgb,var(--a) 22%,transparent),color-mix(in srgb,var(--b) 22%,transparent))}
.ico svg.i{width:26px;height:26px}
.page h2{font-size:clamp(1.6rem,4vw,2.3rem);letter-spacing:-.02em;margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:26px}
.hint{color:var(--muted);font-size:.85rem;margin:20px 0 14px;text-align:center}
.viewer{padding:14px}
.vtitle{font-weight:600;margin:2px 6px 12px}
.viewer iframe{display:block;width:100%;height:70vh;min-height:340px;border:0;border-radius:14px;background:#000}
.vbar{display:flex;gap:10px;justify-content:center;margin-top:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{position:relative;padding:22px;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;cursor:pointer;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px)}
.card small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.last{border-color:var(--a)}
.card.last::after{content:"Last opened";font-size:.72rem;color:var(--a);margin-top:6px}
.card.add{align-items:center;justify-content:center;border-style:dashed;color:var(--muted)}
.card .rm{position:absolute;top:8px;right:12px;background:none;border:0;color:var(--muted);font-size:1.2rem}
.notes{width:100%;min-height:50vh;padding:20px;resize:vertical;font:inherit;line-height:1.6;color:var(--text)}
.notes:focus{outline:none;border-color:var(--a)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.sw{display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;font-size:.9rem;border-radius:16px;border:1px solid var(--edge);background:rgba(255,255,255,.06);transition:border-color .2s,background .2s}
.sw:hover{background:rgba(255,255,255,.12)}
.sw i{width:28px;height:28px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.3)}
.sw.sel{border-color:var(--a);background:rgba(255,255,255,.12)}
.sw.sel::after{content:"\2713";margin-left:auto;color:var(--a);font-weight:700}
.foot{text-align:center;font-size:.7rem;color:var(--muted);opacity:.7;padding:0 0 16px}
.panel{padding:22px;margin-bottom:26px}
.panel h3,.sec{font-size:1.1rem;font-weight:600}
.sec{margin:4px 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.field{flex:1;min-width:140px;padding:11px 16px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:var(--text);font:inherit}
.field:focus{outline:none;border-color:var(--a)}
.code{font-size:2.2rem;font-weight:700;letter-spacing:.3em;color:var(--a);margin-top:14px}
.stat{color:var(--muted);font-size:.85rem;margin-top:10px}
#remote{display:block;width:100%;max-height:70vh;border-radius:14px;background:#000;margin-top:14px}
.log{height:240px;overflow:auto;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.05);font-size:.88rem;line-height:1.5;margin-bottom:10px}
.log p{margin:0 0 6px;word-break:break-word}.log b{color:var(--a)}
.rm{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.scr{position:relative;flex:2 1 420px;min-width:0;aspect-ratio:16/9;border-radius:14px;background:#000;border:1px solid var(--edge);overflow:hidden;display:grid;place-items:center;text-align:center}
.scr.mini{aspect-ratio:auto;min-height:150px;flex:1 1 100%}
.scr video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.ov{padding:20px;color:var(--muted);font-size:.95rem}
.rm>div:last-child{flex:1 1 260px;min-width:0}
.scr.mini~div{flex-basis:100%}
.ver{font-size:.65rem;margin-top:2px;opacity:.8}
.tabs{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.tabs .btn.sel{border-color:var(--a);background:rgba(255,255,255,.2)}
.log.tall{height:360px}
.log small{color:var(--muted);font-size:.7rem}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:460px){.grid{grid-template-columns:1fr}}
</style>

  var t0=S.get('theme',CFG.theme||'midnight'); setTheme(THEMES.some(function(t){return t[0]===t0})?t0:'midnight');
  var start=S.get('page','home');
  show(document.getElementById(start)?start:'home');

  /* ---- Apply owner config ---- */
  if(CFG.msg){var an=document.createElement('p');an.textContent=CFG.msg;an.style.cssText='margin-top:14px;color:var(--a);font-weight:600';document.querySelector('#home .hero').appendChild(an)}
  (CFG.hide||[]).forEach(function(id){var t=document.querySelector('.tile[data-go="'+id+'"]');if(t)t.hidden=true});
  if(CFG.ver)document.querySelector('.ver').textContent=CFG.ver;
})();
</script>
</template>

<!-- ============ THE OWNER PANEL (separate page, separate password) ============ -->
<template id="owner">
<style>

<div class="w">

<script>
(function(){
var K='madowner_cfg',C=JSON.parse(JSON.stringify(window.__CFG||{})),$=function(i){return document.getElementById(i)};
var SEC=['games','proxies','share','notes','movies','tools','ai','chat','settings'],TH=['midnight','ocean','sunset','forest','henry','rose','slate','rainbow'];
function norm(){C.hide=C.hide||[];C.links=C.links||{};C.del=C.del||{}}
function fill(){$('msg').value=C.msg||'';$('ttl').value=C.title||'';$('ver').value=C.ver||'';$('uc').value=C.ucode||'';$('th').value=C.theme||'midnight'}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e}
function paint(){
 var s=$('secs');s.textContent='';
 SEC.forEach(function(id){var l=el('label','ck'),c=el('input');c.type='checkbox';c.checked=C.hide.indexOf(id)<0;
  c.onchange=function(){C.hide=C.hide.filter(function(x){return x!==id});if(!c.checked)C.hide.push(id);save()};
  l.appendChild(c);l.appendChild(document.createTextNode(id));s.appendChild(l)});
 var L=$('links');L.textContent='';
 Object.keys(C.links).forEach(function(id){C.links[id].forEach(function(x,i){
  var r=el('div','r'),d=el('button','b','Remove');d.onclick=function(){C.links[id].splice(i,1);save()};
  r.appendChild(el('span','',id+': '+x.n+' - '+x.u));r.appendChild(d);L.appendChild(r)})});
 var h=Object.keys(C.del).filter(function(id){return C.del[id].length}).map(function(id){return id+': '+C.del[id].join(', ')});
 $('dels').textContent=h.length?'Hidden defaults - '+h.join(' | '):'';
 $('exp').value=JSON.stringify(C);
}
function save(m){try{localStorage.setItem(K,JSON.stringify(C))}catch(e){}$('st').textContent=m||'Saved. Reopen the user site to see it.';paint()}
TH.forEach(function(t){var o=el('option','',t);o.value=t;$('th').appendChild(o)});
norm();fill();paint();
$('save1').onclick=function(){C.msg=$('msg').value.trim();C.title=$('ttl').value.trim();C.ver=$('ver').value.trim();C.ucode=$('uc').value.trim();C.theme=$('th').value;
 try{localStorage.setItem('mad_theme',JSON.stringify(C.theme))}catch(e){}document.documentElement.dataset.theme=C.theme;save()};
$('addl').onclick=function(){var id=$('ls').value,n=$('ln').value.trim(),u=$('lu').value.trim();if(!n||!u)return;
 if(!/^https?:\/\//i.test(u))u='https://'+u;(C.links[id]=C.links[id]||[]).push({n:n,u:u,d:'Added by owner'});$('ln').value=$('lu').value='';save()};
$('hidel').onclick=function(){var id=$('ls').value,n=$('ln').value.trim();if(!n)return;(C.del[id]=C.del[id]||[]).push(n);$('ln').value='';save()};
$('unh').onclick=function(){C.del={};save()};
$('say').onclick=function(){var t=$('ot').value.trim();if(!t)return;
 fetch('https://ntfy.sh/mad-global-chat-9xq4k2',{method:'POST',body:JSON.stringify({n:'OWNER',t:t.slice(0,300),c:'#C5B358'})})
 .then(function(){$('ot').value='';$('st').textContent='Posted to global chat.'}).catch(function(){$('st').textContent='Could not post.'})};
$('clr').onclick=function(){try{localStorage.removeItem('mad_gchat')}catch(e){}$('st').textContent='Cleared saved chat on this device.'};
$('cp').onclick=function(){$('exp').select();try{navigator.clipboard.writeText($('exp').value)}catch(e){}$('st').textContent='Copied.'};
$('rst').onclick=function(){if(!confirm('Reset owner config?'))return;try{localStorage.removeItem(K)}catch(e){}C={};norm();fill();save('Reset.')};
})();
</script>
</template>

<script>
/* ================= SETTINGS ================= */
var USER_CODE   = "Player1234";    // regular user / tester code
var OWNER_CODE  = "Maddex2012";    // opens the Owner panel
var TAB_TITLE   = "Home";          // title shown on the about:blank tab
var DEFAULT_CFG = {};              // paste the Owner panel's exported config here to apply it to everyone

/* ================= LOGIC ================= */
var input = document.getElementById('code');
var err   = document.getElementById('err');
var card  = document.getElementById('card');

function savedTheme(){
  try{ return JSON.parse(localStorage.getItem('mad_theme')) || 'midnight'; }catch(e){ return 'midnight'; }
}
function getCfg(){
  try{ var c = JSON.parse(localStorage.getItem('madowner_cfg')); if (c) return c; }catch(e){}
  return DEFAULT_CFG;
}
document.documentElement.dataset.theme = savedTheme();

function buildSite(id){
  var cfg = getCfg();
  return '<!DOCTYPE html><html lang="en" data-theme="' + savedTheme() + '"><head><meta charset="UTF-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<title>' + (id === 'owner' ? 'Owner' : (cfg.title || TAB_TITLE)) + '</title><style>' +
    document.getElementById('base').textContent +
    '</style></head><body><script>window.__CFG=' + JSON.stringify(cfg).replace(/</g, '\\u003c') + ';<\/script>' +
    document.getElementById(id).innerHTML +
    '</body></html>';
}

function unlock(){
  var v = input.value, id = null;
  if (v === OWNER_CODE) id = 'owner';
  else if (v === (getCfg().ucode || USER_CODE)) id = 'app';
  if (!id){
    err.textContent = 'Wrong code. Try again.';
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    input.value = ''; input.focus();
    return;
  }
  var html = buildSite(id);
  var w = window.open('about:blank', '_blank');
  if (w){
    w.document.open(); w.document.write(html); w.document.close();
    input.value = ''; err.textContent = '';
  } else {
    // Popup blocked: show the site right here instead
    document.open(); document.write(html); document.close();
  }
}

document.getElementById('go').addEventListener('click', unlock);
input.addEventListener('keydown', function(e){ if (e.key === 'Enter') unlock(); });
</script>
</body>
</html>

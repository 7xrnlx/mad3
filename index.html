<!DOCTYPE html>
<html lang="en" data-theme="midnight" data-bg="orbs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome</title>

<!-- Shared styles: lock screen AND the about:blank site -->
<style id="base">
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap');
:root{--bg:#0a0e1c;--text:#eef1ff;--muted:#9aa3c7;--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.15);--a:#5eead4;--b:#a78bfa;--on:#0a0e1c}
/* ---- THEMES ---- */
[data-theme=ocean]{--bg:#041320;--a:#38bdf8;--b:#3b82f6;--on:#041320}
[data-theme=sunset]{--bg:#180a13;--a:#fb923c;--b:#f43f5e;--on:#180a13}
[data-theme=forest]{--bg:#06130d;--a:#4ade80;--b:#14b8a6;--on:#06130d}
[data-theme=henry]{--bg:#03160b;--a:#C5B358;--b:#1f8a4c;--on:#03160b;--muted:#a9b79a;--glass:rgba(197,179,88,.07);--edge:rgba(197,179,88,.28)}
[data-theme=rose]{--bg:#150a1c;--a:#f472b6;--b:#c084fc;--on:#150a1c}
[data-theme=slate]{--bg:#0d0f12;--a:#e2e8f0;--b:#64748b;--on:#0d0f12}
[data-theme=neon]{--bg:#0a0612;--a:#a3ff12;--b:#ff2bd6;--on:#0a0612}
[data-theme=ice]{--bg:#06121c;--a:#bae6fd;--b:#67e8f9;--on:#06121c}
[data-theme=lava]{--bg:#1a0805;--a:#ffb347;--b:#ff3b1f;--on:#1a0805}
[data-theme=candy]{--bg:#150f22;--a:#ffa6e7;--b:#8ae0ff;--on:#150f22}
@property --h{syntax:'<number>';inherits:true;initial-value:0}
@keyframes hue{to{--h:360}}
[data-theme=rainbow]{--bg:#0b0b12;--a:hsl(var(--h) 90% 65%);--b:hsl(calc(var(--h) + 140) 90% 65%);--on:#0b0b12;animation:hue 14s steps(70) infinite}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
[hidden]{display:none!important}
html{scrollbar-gutter:stable;-webkit-text-size-adjust:100%}body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body{font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow-x:clip;transition:background .4s}
body::before,body::after{content:"";position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.4;z-index:-1;animation:drift 22s ease-in-out infinite alternate}
body::before{background:var(--b);top:-18vmax;left:-12vmax}
body::after{background:var(--a);bottom:-22vmax;right:-14vmax;animation-delay:-8s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
:where(html[data-bg]:not([data-bg=orbs])) body::before,:where(html[data-bg]:not([data-bg=orbs])) body::after{filter:none;border-radius:0;width:100%;height:100%;inset:0;opacity:1;animation:none;background:none;margin:0;transform:none}
@keyframes sway{to{transform:translate(6vmax,-4vmax) rotate(6deg) scale(1.12)}}
@keyframes twinkle{to{opacity:.35}}
@keyframes slidebg{to{background-position:44px 44px}}
@keyframes meshmove{to{transform:scale(1.25) rotate(8deg)}}
html[data-bg=grid] body::before{opacity:.45;background-image:linear-gradient(var(--edge) 1px,transparent 1px),linear-gradient(90deg,var(--edge) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(circle at 50% 25%,#000 15%,transparent 75%);mask-image:radial-gradient(circle at 50% 25%,#000 15%,transparent 75%);animation:slidebg 5s linear infinite}
html[data-bg=grid] body::after{inset:auto;left:50%;top:-25vmax;width:70vmax;height:60vmax;margin-left:-35vmax;border-radius:50%;background:var(--a);filter:blur(130px);opacity:.22}
html[data-bg=aurora] body::before{inset:auto;left:-15vmax;top:6vmax;width:130vmax;height:34vmax;border-radius:50%;background:linear-gradient(90deg,var(--a),var(--b),var(--a));filter:blur(90px);opacity:.32;animation:sway 14s ease-in-out infinite alternate}
html[data-bg=aurora] body::after{inset:auto;left:-20vmax;bottom:-4vmax;width:130vmax;height:30vmax;border-radius:50%;background:linear-gradient(90deg,var(--b),var(--a),var(--b));filter:blur(100px);opacity:.28;animation:sway 18s ease-in-out -6s infinite alternate-reverse}
html[data-bg=stars] body::before{background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 70px,#fff,transparent),radial-gradient(2px 2px at 150px 120px,var(--a),transparent),radial-gradient(1px 1px at 60px 140px,#fff,transparent),radial-gradient(1.5px 1.5px at 130px 20px,var(--b),transparent);background-size:180px 180px;opacity:.85;animation:twinkle 5s ease-in-out infinite alternate}
html[data-bg=stars] body::after{inset:auto;left:50%;bottom:-30vmax;width:90vmax;height:50vmax;margin-left:-45vmax;border-radius:50%;background:var(--b);filter:blur(120px);opacity:.28}
html[data-bg=dots] body::before{background-image:radial-gradient(var(--edge) 1.6px,transparent 2.2px);background-size:26px 26px;opacity:.9;animation:slidebg 9s linear infinite}
html[data-bg=dots] body::after{inset:auto;right:-10vmax;top:-12vmax;width:50vmax;height:50vmax;border-radius:50%;background:var(--a);filter:blur(110px);opacity:.26}
html[data-bg=mesh] body::before{inset:-20%;width:140%;height:140%;background:radial-gradient(at 18% 22%,var(--a) 0,transparent 42%),radial-gradient(at 82% 28%,var(--b) 0,transparent 42%),radial-gradient(at 50% 92%,var(--a) 0,transparent 48%);opacity:.34;filter:blur(30px);animation:meshmove 16s ease-in-out infinite alternate}
.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);border-radius:24px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<!-- Lock screen only -->
<style>
.lock{min-height:100%;display:grid;place-items:center;padding:24px}
.lock .glass{width:min(380px,100%);padding:40px 32px;text-align:center}
.lock h1{font-size:1.5rem;font-weight:600;margin-bottom:8px}
.lock p{color:var(--muted);font-size:.9rem;margin-bottom:26px}
.lock input{width:100%;padding:14px 16px;border-radius:14px;text-align:center;letter-spacing:.05em;font:inherit;background:rgba(255,255,255,.06);border:1px solid var(--edge);color:var(--text);transition:border-color .2s,box-shadow .2s}
.lock input:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.lock button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;font-weight:600;background:linear-gradient(135deg,var(--a),var(--b));color:var(--on);transition:transform .15s,filter .2s}
.lock button:hover{filter:brightness(1.1)}
.lock button:active{transform:scale(.98)}
.lock .err{min-height:1.2em;margin-top:14px;font-size:.85rem;color:#fda4af}
.lock .show{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:.85rem;color:var(--muted);cursor:pointer}.lock .show input{width:auto;padding:0;letter-spacing:normal}.lock #user{margin-bottom:12px}
.lock .tabs2{display:flex;gap:8px;margin-bottom:22px}.lock .tabs2 button{flex:1;margin:0;padding:10px;background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--edge);font-size:.85rem}.lock .tabs2 button.sel{background:linear-gradient(135deg,var(--a),var(--b));color:var(--on);border-color:transparent}
.lock .glass.shake{animation:shake .4s}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes swap{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:200% center}}
.lock .glass{animation:cardIn .85s cubic-bezier(.16,1,.3,1) both}
.lock .glass>*{animation:rise .65s cubic-bezier(.16,1,.3,1) both}
.lock .glass>*:nth-child(1){animation-delay:.12s}.lock .glass>*:nth-child(2){animation-delay:.2s}.lock .glass>*:nth-child(3){animation-delay:.28s}.lock .glass>*:nth-child(4){animation-delay:.36s}.lock .glass>*:nth-child(5){animation-delay:.44s}.lock .glass>*:nth-child(6){animation-delay:.52s}.lock .glass>*:nth-child(7){animation-delay:.6s}
.lock .glass>h1{background:linear-gradient(90deg,var(--text),var(--a),var(--b),var(--text));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .65s .2s cubic-bezier(.16,1,.3,1) both,shine 7s linear infinite}
.lock .glass>h1.fx{animation:swap .5s cubic-bezier(.16,1,.3,1) both,shine 7s linear infinite}
.lock .glass>p.fx{animation:swap .5s .06s cubic-bezier(.16,1,.3,1) both}
.lock .tabs2 button{transition:background .35s,color .35s,transform .15s,filter .2s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
</style>
</head>

<body>

<!-- ============ LOCK SCREEN ============ -->
<main class="lock">
  <div class="glass" id="card">
    <div class="tabs2"><button id="tIn" class="sel">Welcome back</button><button id="tUp">Create account</button></div>
    <h1 id="lh">Welcome back</h1>
    <p id="lp">Sign in to jump back in.</p>
    <input id="user" type="text" autocomplete="username" maxlength="20" placeholder="Username" autofocus aria-label="Username">
    <input id="code" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
    <label class="show"><input type="checkbox" id="showpw"> Show password</label>
    <button id="go">Let's go</button>
    <div class="err" id="err" role="alert"></div>
  </div>
</main>

<!-- ============ THE USER SITE (loaded into about:blank) ============ -->
<template id="app">
<style>
body{height:auto;min-height:100dvh;display:flex;flex-direction:column}
.top{position:sticky;top:16px;z-index:10;margin:16px auto 0;width:min(1040px,calc(100% - 32px));display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 22px;border-radius:999px}
.brand{font-weight:700;font-size:1.05rem;background:none;border:0}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.1);font-weight:600;font-size:.88rem;transition:background .2s,opacity .3s,transform .3s}
.btn:hover{background:rgba(255,255,255,.2)}
.btn.hidden{opacity:0;pointer-events:none;transform:translateX(8px)}
main.stage{flex:1;width:min(1040px,calc(100% - 32px));margin:0 auto;padding:44px 0 40px}
.page{display:none}
.page.active{display:block;animation:in .5s cubic-bezier(.16,1,.3,1) backwards}
.page.leaving{display:block;animation:out .22s ease-in forwards;pointer-events:none}
@keyframes in{from{opacity:0;transform:translateY(20px) scale(.985)}}
@keyframes out{to{opacity:0;transform:translateY(-12px) scale(.985)}}
.hero{text-align:center;padding:36px 0 42px}
.hero h1{font-size:clamp(2.2rem,6vw,3.8rem);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hero p{color:var(--muted);margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px}
.tile{padding:28px 24px;text-align:left;display:flex;flex-direction:column;gap:12px;transition:transform .25s,border-color .25s,background .25s}
.tile:hover{transform:translateY(-4px);border-color:var(--a);background:rgba(255,255,255,.1)}
.tile b{font-size:1.1rem;font-weight:600}
.tile .d{color:var(--muted);font-size:.85rem}
.ico{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;border:1px solid var(--edge);color:var(--a);background:linear-gradient(135deg,color-mix(in srgb,var(--a) 22%,transparent),color-mix(in srgb,var(--b) 22%,transparent))}
.ico svg.i{width:26px;height:26px}
.page h2{font-size:clamp(1.6rem,4vw,2.3rem);letter-spacing:-.02em;margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:26px}
.hint{color:var(--muted);font-size:.85rem;margin:20px 0 14px;text-align:center}
.viewer{padding:14px}
.vtitle{font-weight:600;margin:2px 6px 12px}
.viewer iframe{display:block;width:100%;height:70dvh;min-height:300px;border:0;border-radius:14px;background:#000}
.vbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{position:relative;padding:22px;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;cursor:pointer;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px)}
.card b{overflow-wrap:anywhere}.card small{color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card.last{border-color:var(--a)}
.card.last::after{content:"Last opened";font-size:.72rem;color:var(--a);margin-top:6px}
.card.add{align-items:center;justify-content:center;border-style:dashed;color:var(--muted)}
.card .rm{position:absolute;top:8px;right:12px;background:none;border:0;color:var(--muted);font-size:1.2rem}
.notes{width:100%;min-height:50vh;padding:20px;resize:vertical;font:inherit;line-height:1.6;color:var(--text)}
.notes:focus{outline:none;border-color:var(--a)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.sw{display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;font-size:.9rem;border-radius:16px;border:1px solid var(--edge);background:rgba(255,255,255,.06);transition:border-color .2s,background .2s}
.sw:hover{background:rgba(255,255,255,.12)}
.sw i{width:28px;height:28px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.3)}
.sw.sel{border-color:var(--a);background:rgba(255,255,255,.12)}
.sw.sel::after{content:"\2713";margin-left:auto;color:var(--a);font-weight:700}
.foot{text-align:center;font-size:.7rem;color:var(--muted);opacity:.7;padding:0 0 16px}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.95)}}
.page.active .grid .tile{animation:pop .55s cubic-bezier(.16,1,.3,1) backwards}
.grid .tile:nth-child(2){animation-delay:.05s!important}.grid .tile:nth-child(3){animation-delay:.1s!important}.grid .tile:nth-child(4){animation-delay:.15s!important}.grid .tile:nth-child(5){animation-delay:.2s!important}.grid .tile:nth-child(6){animation-delay:.25s!important}.grid .tile:nth-child(7){animation-delay:.3s!important}.grid .tile:nth-child(8){animation-delay:.35s!important}.grid .tile:nth-child(9){animation-delay:.4s!important}
.page.active .hero h1{animation:pop .6s cubic-bezier(.16,1,.3,1) backwards}
.btn:active,.tile:active,.card:active{transform:scale(.97)}
.btn,.card,.sw,.brand{transition:background .25s,border-color .25s,transform .25s cubic-bezier(.16,1,.3,1),opacity .3s}
.wel{position:fixed;left:50%;top:84px;z-index:90;padding:12px 26px;font-weight:600;pointer-events:none;animation:wel 3.6s cubic-bezier(.16,1,.3,1) both}
@keyframes wel{0%{opacity:0;transform:translate(-50%,-16px) scale(.94)}12%,78%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-10px) scale(.98)}}
.panel{padding:22px;margin-bottom:26px}
.panel h3,.sec{font-size:1.1rem;font-weight:600}
.sec{margin:4px 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.field{flex:1;min-width:140px;padding:11px 16px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:var(--text);font:inherit}
.field:focus{outline:none;border-color:var(--a)}
.code{font-size:2.2rem;font-weight:700;letter-spacing:.3em;color:var(--a);margin-top:14px}
.stat{color:var(--muted);font-size:.85rem;margin-top:10px}
#remote{display:block;width:100%;max-height:70vh;border-radius:14px;background:#000;margin-top:14px}

.log p{margin:0 0 6px;word-break:break-word}.log b{color:var(--a)}
.rm{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.scr{position:relative;flex:2 1 420px;min-width:0;aspect-ratio:16/9;border-radius:14px;background:#000;border:1px solid var(--edge);overflow:hidden;display:grid;place-items:center;text-align:center}
.scr.mini{aspect-ratio:auto;min-height:150px;flex:1 1 100%}
.scr video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.ov{padding:20px;color:var(--muted);font-size:.95rem}
.rm>div:last-child{flex:1 1 260px;min-width:0}
.scr.mini~div{flex-basis:100%}
.ver{font-size:.65rem;margin-top:2px;opacity:.8}
.tabs{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.tabs .btn.sel{border-color:var(--a);background:rgba(255,255,255,.2)}
.log.tall{height:360px}
.log small{color:var(--muted);font-size:.7rem}
.cimg{display:block;max-width:min(100%,300px);max-height:240px;border-radius:10px;margin-top:6px;cursor:zoom-in}
.cimg.big{max-width:100%;max-height:none;cursor:zoom-out}
.ovf{position:fixed;inset:0;z-index:100;display:grid;place-items:center;text-align:center;padding:24px;background:var(--bg)}
.ovf h2{font-size:clamp(1.5rem,5vw,2.4rem)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:101;padding:14px 22px;max-width:min(90vw,460px);text-align:center}
.chatoff #share .panel,.chatoff #chat .panel{pointer-events:none;opacity:.45}.trl{position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.9);text-align:center;padding:16px;cursor:pointer}.trl img{max-width:94vw;max-height:80vh;border-radius:12px;object-fit:contain}.trl h2{font-size:clamp(1.4rem,5vw,2.4rem)}
.ctag{display:inline-block;background:linear-gradient(135deg,var(--a),var(--b));color:var(--on);font-size:.62rem;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:999px;margin-right:8px;vertical-align:middle}
@media (max-width:600px){.top{top:8px;margin-top:8px;padding:8px 8px 8px 16px}main.stage{padding:24px 0 28px}.hero{padding:16px 0 24px}.tile{padding:20px 18px}.viewer iframe{height:60dvh;min-height:280px}.cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.panel{padding:16px}.btn{padding:9px 14px}.code{font-size:1.7rem;letter-spacing:.2em}.log.tall{height:300px}.themes{grid-template-columns:1fr 1fr}}
</style>

  var esc = function(t){ return t.replace(/</g, '\\u003c'); };
  var inj = 'window.__CFG=' + esc(JSON.stringify(cfg)) + ';window.__K=' + esc(JSON.stringify(K)) + ';' + cyrb.toString() + ';' + hashPw.toString() + ';';
  return '<!DOCTYPE html><html lang="en" data-theme="' + savedTheme() + '" data-bg="' + savedBg() + '"><head><meta charset="UTF-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' +
    '<title>' + (id === 'owner' ? 'Owner' : (cfg.title || TAB_TITLE)) + '</title><style>' +
    document.getElementById('base').textContent +
    '</style></head><body><script>' + inj + '<\/script>' +
    document.getElementById(id).innerHTML +
    '</body></html>';
}

function localAcc(){ try{ return JSON.parse(localStorage.getItem('madacc')) || {}; }catch(e){ return {}; } }

/* all known accounts: this device, the owner's exported list, and the shared sign-up channel */
function getAccts(cb){
  var m = {}, L = localAcc(), done = false;
  Object.keys(L).forEach(function(k){ m[k] = L[k]; });
  (getCfg().accounts || []).forEach(function(a){ m[a.u] = {d:a.d, h:a.h}; });
  function fin(){ if(!done){ done = true; cb(m); } }
  setTimeout(fin, 5000);
  fetch('https://ntfy.sh/' + ACC_TOPIC + '/json?poll=1&since=all')
    .then(function(r){ return r.text(); })
    .then(function(t){
      t.split('\n').forEach(function(l){
        try{
          var d = JSON.parse(l), o = JSON.parse(d.message);
          if (d.event !== 'message' || !o || o.key !== CTL_KEY) return;
          var k = String(o.u || '').toLowerCase();
          if (o.k === 'acct' && !m[k]) m[k] = {d:String(o.d || k).slice(0, 20), h:o.h};
          else if (o.k === 'reset' && m[k]) m[k].h = o.h;
          else if (o.k === 'del') delete m[k];
        }catch(e){}
      });
      fin();
    }).catch(fin);
}

/* owner commands saved on the channel: site down, bans, timeouts */
function getState(cb){
  var st = {down:0, msg:'', bans:[], to:{}}, done = false;
  function fin(){ if(!done){ done = true; cb(st); } }
  setTimeout(fin, 5000);
  fetch('https://ntfy.sh/' + CTL_TOPIC + '/json?poll=1&since=all')
    .then(function(r){ return r.text(); })
    .then(function(t){
      t.split('\n').forEach(function(l){
        try{
          var d = JSON.parse(l), o = JSON.parse(d.message);
          if (d.event !== 'message' || !o || o.key !== CTL_KEY) return;
          if (o.k === 'down'){ st.down = 1; st.msg = o.t || ''; }
          else if (o.k === 'up') st.down = 0;
          else if (o.k === 'ban' && st.bans.indexOf(o.u) < 0) st.bans.push(o.u);
          else if (o.k === 'unban') st.bans = st.bans.filter(function(x){ return x !== o.u; });
          else if (o.k === 'timeout') st.to[o.u] = +o.until || 0;
          else if (o.k === 'untimeout') delete st.to[o.u];
        }catch(e){}
      });
      fin();
    }).catch(fin);
}

function msg(t, ok){ err.textContent = t; err.style.color = ok ? '#86efac' : ''; }
function bad(m){
  msg(m);
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  input.value = ''; input.focus();
}

function setMode(m){
  mode = m;
  tIn.classList.toggle('sel', m === 'in'); tUp.classList.toggle('sel', m === 'up');
  document.getElementById('lh').textContent = m === 'in' ? 'Welcome back' : 'Create your account';
  document.getElementById('lp').textContent = m === 'in' ? 'Sign in to jump back in.' : "Pick a username and password. Please don't reuse a password from anywhere else.";
  userIn.placeholder = m === 'in' ? 'Username' : 'Name';
  input.autocomplete = m === 'in' ? 'current-password' : 'new-password';
  document.getElementById('go').textContent = m === 'in' ? "Let's go" : 'Done';
  ['lh', 'lp'].forEach(function(i){ var e = document.getElementById(i); e.classList.remove('fx'); void e.offsetWidth; e.classList.add('fx'); });
  msg('');
}

function enter(role, name, w){
  var html = buildSite(role, name);
  if (w){ w.document.open(); w.document.write(html); w.document.close(); }
  else { document.open(); document.write(html); document.close(); }
  input.value = ''; msg('');
}

function signUp(){
  var u = userIn.value.trim(), p = input.value, k = u.toLowerCase();
  if (!/^[A-Za-z0-9 ._-]{2,20}$/.test(u)) return msg('Username: 2 to 20 letters, numbers, spaces, . _ or -');
  if (p.length < 4) return msg('Password needs at least 4 characters.');
  if (k === OWNER_USER || RESERVED.indexOf(k) >= 0) return msg('That username is reserved. Pick another one.');
  msg('Creating your account...');
  getAccts(function(m){
    if (m[k]) return msg('That username is taken. Try another one.');
    hashPw(k, p).then(function(h){
      var L = localAcc(); L[k] = {d:u, h:h};
      try{ localStorage.setItem('madacc', JSON.stringify(L)); }catch(e){}
      try{ fetch('https://ntfy.sh/' + ACC_TOPIC, {method:'POST', body:JSON.stringify({key:CTL_KEY, k:'acct', u:k, d:u, h:h})}).catch(function(){}); }catch(e){}
      setMode('in'); userIn.value = u; input.value = ''; input.focus();
      msg('Account created! Welcome aboard, ' + u + '. Sign in to get started.', true);
    });
  });
}

function signIn(){
  var u = userIn.value.trim().slice(0, 20), p = input.value, k = u.toLowerCase();
  if (u.length < 2 || !p) return msg('Enter your username and password.');
  var w = window.open('about:blank', '_blank');
  function fail(m){ if (w) w.close(); bad(m); }
  if (k === OWNER_USER && p.toLowerCase() === OWNER_PASS) return enter('owner', u, w);
  msg('Checking...');
  getAccts(function(m){
    var a = m[k];
    if (!a) return fail('Wrong username or password.');
    hashPw(k, p).then(function(h){
      if (h !== a.h) return fail('Wrong username or password.');
      getState(function(st){
        if (st.down){ if (w) w.close(); return msg('Site is down temporarily.' + (st.msg ? ' ' + st.msg : '')); }
        if (st.bans.indexOf(k) >= 0){ if (w) w.close(); return msg('This account is banned.'); }
        var left = (st.to[k] || 0) * 1000 - Date.now();
        if (left > 0){ if (w) w.close(); return msg('You are timed out for ' + Math.ceil(left / 60000) + ' more minute(s).'); }
        enter('app', a.d, w);
      });
    });
  });
}

function submitForm(){ if (mode === 'up') signUp(); else signIn(); }
tIn.addEventListener('click', function(){ setMode('in'); });
tUp.addEventListener('click', function(){ setMode('up'); });
document.getElementById('showpw').addEventListener('change', function(){ input.type = this.checked ? 'text' : 'password'; });
document.getElementById('go').addEventListener('click', submitForm);
input.addEventListener('keydown', function(e){ if (e.key === 'Enter') submitForm(); });
userIn.addEventListener('keydown', function(e){ if (e.key === 'Enter') input.focus(); });
</script>

<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>

<!-- Shared styles: lock screen AND the about:blank site -->
<style id="base">
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap');
:root{--bg:#0a0e1c;--text:#eef1ff;--muted:#9aa3c7;--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.15);--a:#5eead4;--b:#a78bfa;--on:#0a0e1c}
/* ---- THEMES ---- */
[data-theme=ocean]{--bg:#041320;--a:#38bdf8;--b:#3b82f6;--on:#041320}
[data-theme=sunset]{--bg:#180a13;--a:#fb923c;--b:#f43f5e;--on:#180a13}
[data-theme=forest]{--bg:#06130d;--a:#4ade80;--b:#14b8a6;--on:#06130d}
[data-theme=henry]{--bg:#03160b;--a:#C5B358;--b:#1f8a4c;--on:#03160b;--muted:#a9b79a;--glass:rgba(197,179,88,.07);--edge:rgba(197,179,88,.28)}
[data-theme=rose]{--bg:#150a1c;--a:#f472b6;--b:#c084fc;--on:#150a1c}
[data-theme=slate]{--bg:#0d0f12;--a:#e2e8f0;--b:#64748b;--on:#0d0f12}
@property --h{syntax:'<number>';inherits:true;initial-value:0}
@keyframes hue{to{--h:360}}
[data-theme=rainbow]{--bg:#0b0b12;--a:hsl(var(--h) 90% 65%);--b:hsl(calc(var(--h) + 140) 90% 65%);--on:#0b0b12;animation:hue 14s steps(70) infinite}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
[hidden]{display:none!important}
html{scrollbar-gutter:stable}
body{font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow-x:clip;transition:background .4s}
body::before,body::after{content:"";position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.4;z-index:-1;animation:drift 22s ease-in-out infinite alternate}
body::before{background:var(--b);top:-18vmax;left:-12vmax}
body::after{background:var(--a);bottom:-22vmax;right:-14vmax;animation-delay:-8s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);border-radius:24px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<!-- Lock screen only -->
<style>
.lock{min-height:100%;display:grid;place-items:center;padding:24px}
.lock .glass{width:min(380px,100%);padding:40px 32px;text-align:center}
.lock h1{font-size:1.5rem;font-weight:600;margin-bottom:8px}
.lock p{color:var(--muted);font-size:.9rem;margin-bottom:26px}
.lock input{width:100%;padding:14px 16px;border-radius:14px;text-align:center;letter-spacing:.35em;font:inherit;background:rgba(255,255,255,.06);border:1px solid var(--edge);color:var(--text);transition:border-color .2s,box-shadow .2s}
.lock input:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.lock button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;font-weight:600;background:linear-gradient(135deg,var(--a),var(--b));color:var(--on);transition:transform .15s,filter .2s}
.lock button:hover{filter:brightness(1.1)}
.lock button:active{transform:scale(.98)}
.lock .err{height:1.2em;margin-top:14px;font-size:.85rem;color:#fda4af}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
</style>
</head>

<body>

<!-- ============ LOCK SCREEN ============ -->
<main class="lock">
  <div class="glass" id="card">
    <h1>Enter access code</h1>
    <p>Type your code to continue.</p>
    <input id="code" type="password" autocomplete="off" autofocus aria-label="Access code">
    <button id="go">Unlock</button>
    <div class="err" id="err" role="alert"></div>
  </div>
</main>

<!-- ============ THE REAL SITE (loaded into about:blank) ============ -->
<template id="app">
<style>
body{height:auto;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:16px;z-index:10;margin:16px auto 0;width:min(1040px,calc(100% - 32px));display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 22px;border-radius:999px}
.brand{font-weight:700;font-size:1.05rem;background:none;border:0}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.1);font-weight:600;font-size:.88rem;transition:background .2s,opacity .3s,transform .3s}
.btn:hover{background:rgba(255,255,255,.2)}
.btn.hidden{opacity:0;pointer-events:none;transform:translateX(8px)}
main.stage{flex:1;width:min(1040px,calc(100% - 32px));margin:0 auto;padding:44px 0 40px}
.page{display:none}
.page.active{display:block;animation:in .3s ease}
.page.leaving{display:block;animation:out .18s ease forwards;pointer-events:none}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@keyframes out{to{opacity:0}}
.hero{text-align:center;padding:36px 0 42px}
.hero h1{font-size:clamp(2.2rem,6vw,3.8rem);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hero p{color:var(--muted);margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tile{padding:28px 24px;text-align:left;display:flex;flex-direction:column;gap:12px;transition:transform .25s,border-color .25s,background .25s}
.tile:hover{transform:translateY(-4px);border-color:var(--a);background:rgba(255,255,255,.1)}
.tile b{font-size:1.1rem;font-weight:600}
.tile .d{color:var(--muted);font-size:.85rem}
.ico{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;border:1px solid var(--edge);color:var(--a);background:linear-gradient(135deg,color-mix(in srgb,var(--a) 22%,transparent),color-mix(in srgb,var(--b) 22%,transparent))}
.ico svg.i{width:26px;height:26px}
.page h2{font-size:clamp(1.6rem,4vw,2.3rem);letter-spacing:-.02em;margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:26px}
.hint{color:var(--muted);font-size:.85rem;margin:20px 0 14px;text-align:center}
.viewer{padding:14px}
.vtitle{font-weight:600;margin:2px 6px 12px}
.viewer iframe{display:block;width:100%;height:70vh;min-height:340px;border:0;border-radius:14px;background:#000}
.vbar{display:flex;gap:10px;justify-content:center;margin-top:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{position:relative;padding:22px;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;cursor:pointer;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px)}
.card small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.last{border-color:var(--a)}
.card.last::after{content:"Last opened";font-size:.72rem;color:var(--a);margin-top:6px}
.card.add{align-items:center;justify-content:center;border-style:dashed;color:var(--muted)}
.card .rm{position:absolute;top:8px;right:12px;background:none;border:0;color:var(--muted);font-size:1.2rem}
.notes{width:100%;min-height:50vh;padding:20px;resize:vertical;font:inherit;line-height:1.6;color:var(--text)}
.notes:focus{outline:none;border-color:var(--a)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.sw{display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;font-size:.9rem;border-radius:16px;border:1px solid var(--edge);background:rgba(255,255,255,.06);transition:border-color .2s,background .2s}
.sw:hover{background:rgba(255,255,255,.12)}
.sw i{width:28px;height:28px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.3)}
.sw.sel{border-color:var(--a);background:rgba(255,255,255,.12)}
.sw.sel::after{content:"\2713";margin-left:auto;color:var(--a);font-weight:700}
.foot{text-align:center;font-size:.7rem;color:var(--muted);opacity:.7;padding:0 0 16px}
.panel{padding:22px;margin-bottom:26px}
.panel h3,.sec{font-size:1.1rem;font-weight:600}
.sec{margin:4px 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.field{flex:1;min-width:140px;padding:11px 16px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:var(--text);font:inherit}
.field:focus{outline:none;border-color:var(--a)}
.code{font-size:2.2rem;font-weight:700;letter-spacing:.3em;color:var(--a);margin-top:14px}
.stat{color:var(--muted);font-size:.85rem;margin-top:10px}
#remote{display:block;width:100%;max-height:70vh;border-radius:14px;background:#000;margin-top:14px}
.log{height:240px;overflow:auto;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.05);font-size:.88rem;line-height:1.5;margin-bottom:10px}
.log p{margin:0 0 6px;word-break:break-word}.log b{color:var(--a)}
.rm{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.scr{position:relative;flex:2 1 420px;min-width:0;aspect-ratio:16/9;border-radius:14px;background:#000;border:1px solid var(--edge);overflow:hidden;display:grid;place-items:center;text-align:center}
.scr.mini{aspect-ratio:auto;min-height:150px;flex:1 1 100%}
.scr video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.ov{padding:20px;color:var(--muted);font-size:.95rem}
.rm>div:last-child{flex:1 1 260px;min-width:0}
.scr.mini~div{flex-basis:100%}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:460px){.grid{grid-template-columns:1fr}}
</style>

<!-- Icon set: drawn with the theme's colors -->

  <symbol id="i-games" viewBox="0 0 24 24"><line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.98 3.59C2.6 9.42 2 14.46 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.41-1.41A2 2 0 0 1 9.83 16h4.34a2 2 0 0 1 1.41.59L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.55-.6-6.58-.69-7.26A4 4 0 0 0 17.32 5z"/></symbol>

  <symbol id="i-movies" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18M3 7.5h4M3 12h18M3 16.5h4M17 3v18M17 7.5h4M17 16.5h4"/></symbol>
  <symbol id="i-tools" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/></symbol>

</svg>

<header class="top glass">
  <button class="brand" id="brand" data-go="home">Home</button>
  <button class="btn hidden" id="homeBtn" data-go="home"><svg class="i"><use href="#i-home"/></svg>Home</button>
</header>

<main class="stage" id="stage">
  <section class="page" id="home">
    <div class="hero"><h1>What do you want to do?</h1><p>Pick a section to get started.</p></div>
    <div class="grid">
      <button class="tile glass" data-go="games"><span class="ico"><svg class="i"><use href="#i-games"/></svg></span><b>Games</b><span class="d">Play in your browser</span></button>
      <button class="tile glass" data-go="proxies"><span class="ico"><svg class="i"><use href="#i-proxies"/></svg></span><b>Proxies</b><span class="d">Open sites through a proxy</span></button>

  <section class="page" id="notes">
    <h2>Notes</h2><p class="sub" id="noteStatus">Everything you type is saved automatically.</p>

  <section class="page" id="chat"></section>

  <section class="page" id="settings">  <section class="page" id="settings">
    <h2>Settings</h2><p class="sub">Your theme is saved and will be here when you come back.</p>

<footer class="foot">mad &copy;</footer>

<script>
(function(){
  /* ---- Save system (localStorage, with safe fallback) ---- */
  var S={
    get:function(k,d){try{var v=localStorage.getItem('mad_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
    set:function(k,v){try{localStorage.setItem('mad_'+k,JSON.stringify(v))}catch(e){}},
    clear:function(){try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('mad_')===0)localStorage.removeItem(k)})}catch(e){}}
  };

  /* ---- EDIT ME: default links for each section ---- */
  var SECTIONS={
    games:{title:'Games',sub:'Pick a game to play. Scroll down to switch to another one.',items:[
      {n:'UBG Hyper',d:'Game hub',u:'https://ubghyper.github.io/'}
    ]},
    proxies:{title:'Proxies',sub:'Add a proxy link, then open it here.',items:[]},
    ai:{title:'AI',sub:'Add an AI site you use, then open it here. Some sites block being embedded.',items:[]},
    movies:{title:'Movies',sub:'Add a link, then open it here.',items:[]},
    tools:{title:'Tools',sub:'Add a link, then open it here.',items:[]}
  };
  var THEMES=[
    ['midnight','Midnight','#5eead4','#a78bfa'],
    ['ocean','Ocean','#38bdf8','#3b82f6'],
    ['sunset','Sunset','#fb923c','#f43f5e'],
    ['forest','Forest','#4ade80','#14b8a6'],
    ['henry','Patrick Henry','#C5B358','#1f8a4c'],
    ['rose','Rose','#f472b6','#c084fc'],
    ['slate','Slate','#e2e8f0','#64748b'],
    ['rainbow','Rainbow','','','conic-gradient(#ff5f6d,#ffc371,#fff56d,#5dff8f,#5dc7ff,#b06dff,#ff5f6d)']
  ];
  var NAMES={home:'Home',games:'Games',proxies:'Proxies',share:'Screen Sharing',notes:'Notes',movies:'Movies',tools:'Tools',ai:'AI',chat:'Chat',settings:'Settings'};
  function $(i){return document.getElementById(i)}

  var stage=document.getElementById('stage'), homeBtn=document.getElementById('homeBtn');
  var custom=S.get('custom',{}), current='home', busy=false;

  /* ---- Section pages with embed viewer ---- */
  function build(id){
    var c=SECTIONS[id], p=document.createElement('section');
    p.className='page'; p.id=id;
    p.innerHTML='<h2>'+c.title+'</h2><p class="sub">'+c.sub+'</p>'+
      '<div class="viewer glass" hidden><div class="vtitle"></div><iframe allow="fullscreen; autoplay; gamepad; clipboard-write" referrerpolicy="no-referrer"></iframe>'+
      '<div class="vbar"><button class="btn" data-act="close"><svg class="i"><use href="#i-x"/></svg>Close</button>'+
      '<button class="btn" data-act="full"><svg class="i"><use href="#i-max"/></svg>Fullscreen</button></div></div>'+
      '<p class="hint" hidden>Scroll down to switch to another one</p><div class="cards"></div>';
    stage.appendChild(p); render(id);
  }
  function render(id){
    var box=document.querySelector('#'+id+' .cards'), last=S.get('last_'+id,'');
    box.textContent='';
    var list=SECTIONS[id].items.map(function(x){return{it:x}});
    (custom[id]||[]).forEach(function(x,i){list.push({it:x,ci:i})});
    list.forEach(function(o){
      var c=document.createElement('div');
      c.className='card glass'+(o.it.n===last?' last':''); c.tabIndex=0; c.setAttribute('role','button');
      c.innerHTML='<b></b><small></small>';
      c.children[0].textContent=o.it.n; c.children[1].textContent=o.it.d||o.it.u;
      c.onclick=function(){openItem(id,o.it)};
      c.onkeydown=function(e){if(e.key==='Enter')openItem(id,o.it)};
      if(o.ci!==undefined){
        var x=document.createElement('button'); x.className='rm'; x.textContent='\u00d7'; x.title='Remove';
        x.onclick=function(e){e.stopPropagation();custom[id].splice(o.ci,1);S.set('custom',custom);render(id)};
        c.appendChild(x);
      }
      box.appendChild(c);
    });
    var a=document.createElement('div');
    a.className='card glass add'; a.tabIndex=0; a.setAttribute('role','button');
    a.innerHTML='<svg class="i"><use href="#i-plus"/></svg><b>Add link</b>';
    a.onclick=function(){
      var n=prompt('Name:'); if(!n)return;
      var u=prompt('Link (https://...):'); if(!u)return;
      if(!/^https?:\/\//i.test(u))u='https://'+u;
      (custom[id]=custom[id]||[]).push({n:n,u:u,d:'Added by you'});
      S.set('custom',custom); render(id);
    };
    a.onkeydown=function(e){if(e.key==='Enter')a.onclick()};
    box.appendChild(a);
  }
  function openItem(id,it){
    var p=document.getElementById(id), v=p.querySelector('.viewer');
    v.hidden=false; p.querySelector('.hint').hidden=false;
    v.querySelector('.vtitle').textContent=it.n;
    v.querySelector('iframe').src=it.u;
    v._it=it; S.set('last_'+id,it.n); render(id);
    v.scrollIntoView({behavior:'smooth',block:'start'});
  }
  function fullscreen(it){
    var w=window.open('about:blank','_blank'); if(!w)return alert('Allow pop-ups to use fullscreen.');
    w.document.open();
    w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+document.title+'</title><style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%}</style></head><body></body></html>');
    w.document.close();
    var f=w.document.createElement('iframe'); f.allow='fullscreen; autoplay; gamepad; clipboard-write'; f.src=it.u;
    w.document.body.appendChild(f);
  }

  /* ---- Navigation ---- */
  function show(id){
    document.getElementById(current).classList.remove('active');
    document.getElementById(id).classList.add('active');
    homeBtn.classList.toggle('hidden',id==='home'); current=id; $('brand').textContent=NAMES[id];
  }
  function go(id){
    if(busy||id===current)return; busy=true;
    var from=document.getElementById(current);
    from.classList.remove('active'); from.classList.add('leaving');
    homeBtn.classList.toggle('hidden',id==='home');
    setTimeout(function(){
      from.classList.remove('leaving');
      document.getElementById(id).classList.add('active');
      current=id; busy=false; S.set('page',id); $('brand').textContent=NAMES[id]; window.scrollTo({top:0});
    },180);
  }
  document.addEventListener('click',function(e){
    var g=e.target.closest('[data-go]'); if(g)return go(g.getAttribute('data-go'));
    var b=e.target.closest('[data-act]'); if(!b)return;
    var v=b.closest('.viewer');
    if(b.dataset.act==='close'){v.querySelector('iframe').src='about:blank';v.hidden=true;var h=v.parentNode.querySelector('.hint');if(h)h.hidden=true}
    else if(v._it)fullscreen(v._it);
  });

  /* ---- Themes ---- */
  var themeBox=document.getElementById('themes');
  function setTheme(id){
    document.documentElement.dataset.theme=id; S.set('theme',id);
    [].forEach.call(themeBox.children,function(b){b.classList.toggle('sel',b.dataset.t===id)});
  }
  THEMES.forEach(function(t){
    var b=document.createElement('button'); b.className='sw'; b.dataset.t=t[0];
    b.innerHTML='<i style="background:'+(t[4]||'linear-gradient(135deg,'+t[2]+','+t[3]+')')+'"></i><span>'+t[1]+'</span>';
    b.onclick=function(){setTheme(t[0])}; themeBox.appendChild(b);
  });

  /* ---- Notes (autosave) ---- */
  var nb=document.getElementById('noteBox'), ns=document.getElementById('noteStatus'), nt;
  nb.value=S.get('notes','');
  nb.addEventListener('input',function(){
    clearTimeout(nt); ns.textContent='Saving...';
    nt=setTimeout(function(){S.set('notes',nb.value);ns.textContent='Saved.'},400);
  });

  document.getElementById('reset').onclick=function(){
    if(!confirm('Clear your theme, notes and added links?'))return;
    S.clear(); custom={}; nb.value=''; setTheme('midnight');
    Object.keys(SECTIONS).forEach(render);
  };

  /* ---- Rooms: screen sharing + chat (WebRTC via PeerJS cloud) ---- */
  function roomHTML(p,screen,title,sub){
    var d=function(x){return ' id="'+p+x+'"'};
    return '<h2>'+title+'</h2><p class="sub">'+sub+'</p><div class="panel glass">'+
      '<div class="row" style="margin-top:0">'+
      '<input class="field"'+d('Name')+' maxlength="20" placeholder="Your name" aria-label="Your name" style="flex:none;width:140px">'+
      '<button class="btn"'+d('Mk')+'>Create code</button>'+
      '<input class="field"'+d('In')+' maxlength="5" placeholder="Enter code" aria-label="Room code" style="flex:none;width:130px;text-transform:uppercase">'+
      '<button class="btn"'+d('Jn')+'>Join</button>'+
      (screen?'<button class="btn"'+d('Sh')+' hidden>Share my screen</button>':'')+
      '<button class="btn"'+d('Lv')+' hidden>Leave</button></div>'+
      '<p class="stat"'+d('Msg')+'></p>'+
      '<div class="rm"><div class="scr'+(screen?'':' mini')+'">'+
        (screen?'<video'+d('Vid')+' playsinline autoplay muted controls hidden></video>':'')+
        '<div class="ov"'+d('Ov')+'><div class="code"'+d('Code')+'></div><div'+d('Txt')+'></div></div></div>'+
        '<div'+d('Chat')+' hidden><div class="log"'+d('Log')+'></div>'+
        '<div class="row" style="margin-top:0"><input class="field"'+d('ChatIn')+' maxlength="300" placeholder="Type a message" aria-label="Chat message"><button class="btn"'+d('Send')+'>Send</button></div></div>'+
      '</div></div>';
  }

  function room(p,screen,prefix){
    var E=function(x){return $(p+x)};
    var peer=null,isHost=false,ready=false,conns=[],hc=null,stream=null,calls=[],remote=null,sharing=null,code='',to=null;
    var ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

    function msg(t){E('Msg').textContent=t||''}
    function me(){return E('Name').value.trim().slice(0,20)||(isHost?'Host':'Guest')}
    function ui(){
      var inRoom=!!peer&&ready, c='', t;
      E('Mk').disabled=E('Jn').disabled=!!peer; E('Lv').hidden=!peer; E('Chat').hidden=!inRoom;
      if(!peer)t=screen?'Create a code, or type a code to join a room.':'Create a code, or type a code to join a chat.';
      else if(!ready)t='Connecting...';
      else if(isHost&&!conns.length){c=code;t='Waiting for someone to join. Give them this code.'}
      else if(screen){c=isHost?code:'';t=stream?'You are sharing your screen.':(sharing?sharing+' is sharing their screen...':'Nobody is sharing their screen currently.')}
      else{c=isHost?code:'';t='Connected. Say hi in the chat.'}
      E('Code').textContent=c; E('Txt').textContent=t;
      if(screen){
        var showV=!!remote&&!stream&&!!sharing;
        E('Vid').hidden=!showV; E('Ov').hidden=showV;
        E('Sh').hidden=!inRoom; E('Sh').textContent=stream?'Stop sharing':'Share my screen';
      }
    }
    function say(f,t){
      var l=E('Log'),q=document.createElement('p'),b=document.createElement('b');
      b.textContent=f+': '; q.appendChild(b); q.appendChild(document.createTextNode(t));
      l.appendChild(q); l.scrollTop=l.scrollHeight;
    }
    function bc(m,x){conns.forEach(function(c){if(c!==x&&c.open)c.send(m)})}
    function up(m){if(isHost)bc(m);else if(hc&&hc.open)hc.send(m)}
    function sys(t){say('System',t);bc({t:'sys',text:t})}
    function closeCalls(){calls.forEach(function(c){try{c.close()}catch(e){}});calls=[]}
    function setRemote(s){
      remote=s;
      if(screen){var v=E('Vid');v.srcObject=s||null;if(s)v.play().catch(function(){})}
      ui();
    }
    function callOut(id,s){if(peer)calls.push(peer.call(id,s))}

    function onCall(c){
      c.answer();
      c.on('stream',function(s){
        if(remote===s)return;
        setRemote(s);
        if(isHost)conns.forEach(function(x){if(x.peer!==c.peer&&x.open)callOut(x.peer,s)});
      });
    }
    function onData(m,c){
      if(m.t==='chat'){say(m.from,m.text);if(isHost)bc(m,c)}
      else if(m.t==='sys')say('System',m.text);
      else if(m.t==='share'){
        sharing=m.by; if(c)c.sharer=!!m.by; if(isHost)bc(m,c);
        if(!m.by){if(!stream)closeCalls();setRemote(null)}else ui();
        msg(m.by?m.by+' is sharing their screen.':'Screen sharing stopped.');
      }
    }
    function onConn(c){
      c.on('data',function(m){
        if(m.t==='hi'){c.name=String(m.name||'Guest').slice(0,20);sys(c.name+' joined')}
        else onData(m,c);
      });
      c.on('open',function(){
        conns.push(c); ui();
        if(sharing)c.send({t:'share',by:sharing});
        if(stream)callOut(c.peer,stream);else if(remote)callOut(c.peer,remote);
      });
      c.on('close',function(){
        if(!peer)return;
        conns=conns.filter(function(x){return x!==c});
        sys((c.name||'Someone')+' left');
        if(c.sharer){sharing=null;closeCalls();setRemote(null);bc({t:'share',by:null})}
        ui();
      });
    }

    function load(cb){
      if(window.Peer)return cb();
      var urls=['https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js','https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'],i=0;
      (function next(){
        var sc=document.createElement('script'); sc.src=urls[i]; sc.onload=cb;
        sc.onerror=function(){if(++i<urls.length)next();else leave('Could not load the connection library. Check your internet.')};
        document.head.appendChild(sc);
      })();
    }
    function create(){
      E('Mk').disabled=E('Jn').disabled=true; msg('Creating your code...');
      load(function(){
        code=''; for(var i=0;i<5;i++)code+=ALPHA.charAt(Math.floor(Math.random()*ALPHA.length));
        isHost=true; var pr=new Peer(prefix+code); peer=pr; ui();
        to=setTimeout(function(){leave('Could not reach the connection server. Check your internet and try again.')},12000);
        pr.on('open',function(){clearTimeout(to);ready=true;msg('Code created. Give it to the other person.');ui()});
        pr.on('connection',onConn); pr.on('call',onCall);
        pr.on('error',function(e){
          clearTimeout(to);
          if(e.type==='unavailable-id'){peer=null;pr.destroy();create()}else leave('Connection error: '+e.type);
        });
      });
    }
    function join(){
      var c0=E('In').value.trim().toUpperCase(); if(!c0)return msg('Type a code first.');
      E('Mk').disabled=E('Jn').disabled=true; msg('Joining...');
      load(function(){
        isHost=false; code=c0; var pr=new Peer(); peer=pr; ui();
        to=setTimeout(function(){leave('No room found with that code.')},12000);
        pr.on('open',function(){
          hc=pr.connect(prefix+code,{reliable:true});
          hc.on('open',function(){clearTimeout(to);ready=true;hc.send({t:'hi',name:me()});msg('Joined room '+code+'.');ui()});
          hc.on('data',function(m){onData(m)});
          hc.on('close',function(){if(peer)leave('The host closed the room.')});
        });
        pr.on('call',onCall);
        pr.on('error',function(e){clearTimeout(to);leave(e.type==='peer-unavailable'?'No room found with that code.':'Connection error: '+e.type)});
      });
    }
    function leave(m){
      clearTimeout(to);
      if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
      var pr=peer; peer=null; try{if(pr)pr.destroy()}catch(e){}
      ready=false; isHost=false; conns=[]; hc=null; calls=[]; remote=null; sharing=null;
      if(screen)E('Vid').srcObject=null;
      E('Log').textContent=''; ui(); msg(m||'');
    }

    function share(){
      if(stream)return stopShare();
      if(sharing)return msg('Someone is already sharing. Wait until they stop.');
      if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia)return msg('Screen sharing is not supported here. Try a desktop browser.');
      navigator.mediaDevices.getDisplayMedia({video:true,audio:true}).then(function(s){
        stream=s; sharing=me(); s.getVideoTracks()[0].onended=stopShare; setRemote(null);
        if(isHost)conns.forEach(function(c){if(c.open)callOut(c.peer,s)});else callOut(prefix+code,s);
        up({t:'share',by:sharing}); msg('You are sharing your screen.'); ui();
      }).catch(function(e){msg(e&&e.name==='NotAllowedError'?'Sharing was cancelled or blocked by the browser.':'Could not start sharing.')});
    }
    function stopShare(){
      if(!stream)return;
      stream.getTracks().forEach(function(t){t.stop()}); stream=null; closeCalls(); sharing=null;
      up({t:'share',by:null}); msg('You stopped sharing.'); ui();
    }
    function chat(){
      var i=E('ChatIn'),t=i.value.trim(); if(!t||!peer||!ready)return; i.value='';
      var m={t:'chat',from:me(),text:t}; say(m.from,t); up(m);
    }

    E('Name').value=S.get('name',''); E('Name').oninput=function(){S.set('name',this.value)};
    E('Mk').onclick=create; E('Jn').onclick=join;
    E('Lv').onclick=function(){leave('You left.')};
    if(screen)E('Sh').onclick=share;
    E('Send').onclick=chat;
    E('ChatIn').onkeydown=function(e){if(e.key==='Enter')chat()};
    E('In').onkeydown=function(e){if(e.key==='Enter')join()};
    ui();
  }
  $('share').innerHTML=roomHTML('sh',true,'Screen Sharing','Create a code and give it to someone, or enter their code. Once you are both in, either of you can share a screen.');
  $('chat').innerHTML=roomHTML('ch',false,'Chat','Create a code and give it to a friend, or enter their code to start chatting.');
  room('sh',true,'madroom-'); room('ch',false,'madchat-');

  /* ---- Start up ---- */
  Object.keys(SECTIONS).forEach(build);
  var t0=S.get('theme','midnight'); setTheme(THEMES.some(function(t){return t[0]===t0})?t0:'midnight');
  var start=S.get('page','home');
  show(document.getElementById(start)?start:'home');
})();
</script>
</template>

<script>
/* ================= SETTINGS ================= */
var ACCESS_CODE = "1234";          // <-- change this to your code
var TAB_TITLE   = "Home";          // title shown on the about:blank tab

/* ================= LOGIC ================= */
var input = document.getElementById('code');
var err   = document.getElementById('err');
var card  = document.getElementById('card');

// Use the saved theme on the lock screen too
function savedTheme(){
  try{ return JSON.parse(localStorage.getItem('mad_theme')) || 'midnight'; }catch(e){ return 'midnight'; }
}
document.documentElement.dataset.theme = savedTheme();

function buildSite(){
  return '<!DOCTYPE html><html lang="en" data-theme="' + savedTheme() + '"><head><meta charset="UTF-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<title>' + TAB_TITLE + '</title><style>' +
    document.getElementById('base').textContent +
    '</style></head><body>' +
    document.getElementById('app').innerHTML +
    '</body></html>';
}

function unlock(){
  if (input.value !== ACCESS_CODE){
    err.textContent = 'Wrong code. Try again.';
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    input.value = ''; input.focus();
    return;
  }
  var html = buildSite();
  var w = window.open('about:blank', '_blank');
  if (w){
    w.document.open(); w.document.write(html); w.document.close();
    input.value = ''; err.textContent = '';
  } else {
    // Popup blocked: show the site right here instead
    document.open(); document.write(html); document.close();
  }
}

document.getElementById('go').addEventListener('click', unlock);
input.addEventListener('keydown', function(e){ if (e.key === 'Enter') unlock(); });
</script>
</body>
